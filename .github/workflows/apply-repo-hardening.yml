name: Apply repo hardening

on:
  push:
    paths:
      - 'tools/repo_hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hardening and capture failures
        shell: bash
        run: |
          set +e
          python3 tools/repo_hardening.py > /tmp/hardening.log 2>&1
          status=$?
          cat /tmp/hardening.log
          if [ "$status" -ne 0 ]; then
            {
              echo '# Hardening Diagnostic'
              echo
              echo "Exit code: $status"
              echo
              echo '```text'
              cat /tmp/hardening.log
              echo '```'
            } > HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HARDENING_DEBUG.md
            git commit -m 'Record hardening verification diagnostic'
            git push
            exit "$status"
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set +e
          errors=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/tmp/node-check.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Syntax failure: $file"
              cat /tmp/node-check.log
              errors=1
            fi
          done < <(find assets netlify/functions -type f -name '*.js' -print0)
          if [ "$errors" -ne 0 ]; then
            {
              echo '# JavaScript Syntax Diagnostic'
              echo
              echo 'One or more JavaScript files failed node --check. See workflow output for the file-level errors.'
            } > HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HARDENING_DEBUG.md
            git commit -m 'Record JavaScript syntax diagnostic'
            git push
            exit 1
          fi

      - name: Validate transformed files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          listing = (root / 'listing.html').read_text(encoding='utf-8')
          assert 'Opening contact with' not in listing
          assert 'listing.seller_id' not in listing
          assert 'chat.html?user=' in listing
          assert 'listing.review_count' not in listing
          assert 'formatCurrency(listing.price, listing.currency)' in listing
          marketplace = (root / 'assets/js/videos-marketplace.js').read_text(encoding='utf-8')
          assert not re.search(r'from\(["\']marketplace_items["\']\)\s*\.select\(["\']\*["\']\)', marketplace)
          assert 'authoritativeSellerId' in marketplace
          hardening = (root / 'assets/js/app-hardening.js').read_text(encoding='utf-8')
          assert 'setupMultiFileInputs' not in hardening
          assert 'setupListingContactFix' not in hardening
          print('Final static validation passed.')
          PY

      - name: Remove stale diagnostic on success
        shell: bash
        run: |
          set -euo pipefail
          if [ -f HARDENING_DEBUG.md ]; then
            git rm HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove resolved hardening diagnostic'
            git push
          fi

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git add \
            listing.html \
            assets/js/app-hardening.js \
            assets/js/profile.js \
            assets/js/post.js \
            assets/js/chat.js \
            assets/js/videos-marketplace.js \
            assets/js/admin.js \
            verify.html \
            assets/js/announcements.js
          git commit -m 'Apply repo hardening fixes'
          git push
