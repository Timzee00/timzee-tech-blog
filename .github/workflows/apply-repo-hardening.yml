name: Apply repo hardening

on:
  push:
    paths:
      - '**'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hardening
        id: hardening
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/repo_hardening.py > /tmp/hardening.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/hardening.status
          cat /tmp/hardening.log
          exit "$status"

      - name: Validate JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set +e
          errors=0
          : > /tmp/node-failures.log
          while IFS= read -r -d '' file; do
            node --check "$file" >/tmp/node-check.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Syntax failure: $file" | tee -a /tmp/node-failures.log
              cat /tmp/node-check.log | tee -a /tmp/node-failures.log
              errors=1
            fi
          done < <(find assets netlify/functions -type f -name '*.js' -print0)
          printf '%s\n' "$errors" > /tmp/node.status
          exit "$errors"

      - name: Validate transformed files
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/static-validation.log 2>&1
          from pathlib import Path
          import re
          root = Path('.')
          listing = (root / 'listing.html').read_text(encoding='utf-8')
          required = [
              'formatCurrency(listing.price, listing.currency)',
              'chat.html?user=',
              'listing.user_id',
          ]
          for item in required:
              assert item in listing, f'Listing invariant missing: {item}'
          assert 'Opening contact with' not in listing
          assert 'listing.seller_id' not in listing
          assert 'listing.review_count' not in listing
          marketplace = (root / 'assets/js/videos-marketplace.js').read_text(encoding='utf-8')
          assert not re.search(r'from\(["\']marketplace_items["\']\)\s*\.select\(["\']\*["\']\)', marketplace)
          assert 'listing.data.user_id' in marketplace
          hardening = (root / 'assets/js/app-hardening.js').read_text(encoding='utf-8')
          assert 'setupMultiFileInputs' not in hardening
          assert 'setupListingContactFix' not in hardening
          verify = (root / 'verify.html').read_text(encoding='utf-8')
          assert 'docInput.value = "";' in verify
          admin = (root / 'assets/js/admin.js').read_text(encoding='utf-8')
          assert 'const MAX_MEDIA_FILES = 8;' in admin
          assert 'postMediaFiles.push(file)' in admin
          for path in root.rglob('*.js'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'from\(["\']profiles["\']\)\s*\.select\(["\']\*["\']\)', source):
                  raise AssertionError(f'Raw profiles select(*) remains in {path}')
          print('Final static validation passed.')
          PY
          status=$?
          cat /tmp/static-validation.log
          printf '%s\n' "$status" > /tmp/static.status
          exit "$status"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "head=${GITHUB_SHA}"
            echo "hardening=$(cat /tmp/hardening.status 2>/dev/null || echo missing)"
            echo "syntax=$(cat /tmp/node.status 2>/dev/null || echo missing)"
            echo "static=$(cat /tmp/static.status 2>/dev/null || echo missing)"
            echo
            echo '== hardening =='
            cat /tmp/hardening.log 2>/dev/null || true
            echo
            echo '== javascript =='
            cat /tmp/node-failures.log 2>/dev/null || true
            echo
            echo '== static =='
            cat /tmp/static-validation.log 2>/dev/null || true
            echo
            echo '== git status =='
            git status --short
            echo
            echo '== key grep =='
            grep -nE 'formatCurrency|seller_id|review_count|Opening contact|authoritativeSellerId|select\("\*"\)' listing.html assets/js/videos-marketplace.js 2>/dev/null | head -100 || true
          } > hardening-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-diagnostics-${{ github.run_id }}
          path: hardening-diagnostics.txt
          if-no-files-found: error

      - name: Fail on hardening errors
        if: steps.hardening.outcome == 'failure'
        run: exit 1

      - name: Fail on JavaScript errors
        if: steps.syntax.outcome == 'failure'
        run: exit 1

      - name: Fail on static validation errors
        if: steps.static.outcome == 'failure'
        run: exit 1
