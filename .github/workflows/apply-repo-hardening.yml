name: Apply repo hardening

on:
  push:
    paths:
      - '**'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hardening
        shell: bash
        run: |
          set +e
          python3 tools/repo_hardening.py > /tmp/hardening.log 2>&1
          status=$?
          cat /tmp/hardening.log
          if [ "$status" -ne 0 ]; then
            {
              echo '# Hardening Diagnostic'
              echo
              echo "Exit code: $status"
              echo
              echo '```text'
              cat /tmp/hardening.log
              echo '```'
            } > HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HARDENING_DEBUG.md
            git commit -m 'Record hardening verification diagnostic' || true
            git push origin HEAD:main
            exit "$status"
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set +e
          errors=0
          : > /tmp/node-failures.log
          while IFS= read -r -d '' file; do
            node --check "$file" >/tmp/node-check.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Syntax failure: $file" | tee -a /tmp/node-failures.log
              cat /tmp/node-check.log | tee -a /tmp/node-failures.log
              errors=1
            fi
          done < <(find assets netlify/functions -type f -name '*.js' -print0)
          if [ "$errors" -ne 0 ]; then
            {
              echo '# JavaScript Syntax Diagnostic'
              echo
              echo '```text'
              cat /tmp/node-failures.log
              echo '```'
            } > HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HARDENING_DEBUG.md
            git commit -m 'Record JavaScript syntax diagnostic' || true
            git push origin HEAD:main
            exit 1
          fi

      - name: Validate transformed files
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/static-validation.log 2>&1
          from pathlib import Path
          import re
          root = Path('.')
          listing = (root / 'listing.html').read_text(encoding='utf-8')
          required = [
              'formatCurrency(listing.price, listing.currency)',
              'chat.html?user=',
              'listing.user_id',
          ]
          for item in required:
              assert item in listing, f'Listing invariant missing: {item}'
          assert 'Opening contact with' not in listing
          assert 'listing.seller_id' not in listing
          assert 'listing.review_count' not in listing
          marketplace = (root / 'assets/js/videos-marketplace.js').read_text(encoding='utf-8')
          assert not re.search(r'from\(["\']marketplace_items["\']\)\s*\.select\(["\']\*["\']\)', marketplace)
          assert 'listing.data.user_id' in marketplace
          hardening = (root / 'assets/js/app-hardening.js').read_text(encoding='utf-8')
          assert 'setupMultiFileInputs' not in hardening
          assert 'setupListingContactFix' not in hardening
          verify = (root / 'verify.html').read_text(encoding='utf-8')
          assert 'docInput.value = "";' in verify
          admin = (root / 'assets/js/admin.js').read_text(encoding='utf-8')
          assert 'const MAX_MEDIA_FILES = 8;' in admin
          assert 'postMediaFiles.push(file)' in admin
          for path in root.rglob('*.js'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'from\(["\']profiles["\']\)\s*\.select\(["\']\*["\']\)', source):
                  raise AssertionError(f'Raw profiles select(*) remains in {path}')
          print('Final static validation passed.')
          PY
          status=$?
          cat /tmp/static-validation.log
          if [ "$status" -ne 0 ]; then
            {
              echo '# Static Validation Diagnostic'
              echo
              echo '```text'
              cat /tmp/static-validation.log
              echo '```'
              echo
              echo '### Current snippets'
              echo
              echo '```text'
              grep -nE 'formatCurrency|seller_id|review_count|Opening contact|authoritativeSellerId|select\("\*"\)' listing.html assets/js/videos-marketplace.js | head -80 || true
              echo '```'
            } > HARDENING_DEBUG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HARDENING_DEBUG.md
            git commit -m 'Record static hardening diagnostic' || true
            git push origin HEAD:main
            exit "$status"
          fi

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f CI_HARDENING_TOUCH.txt ]; then
            git rm CI_HARDENING_TOUCH.txt
            changed=1
          fi
          if [ -f HARDENING_DEBUG.md ]; then
            git rm HARDENING_DEBUG.md
            changed=1
          fi
          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove hardening diagnostics'
            git push origin HEAD:main
          fi

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            listing.html \
            assets/js/app-hardening.js \
            assets/js/profile.js \
            assets/js/post.js \
            assets/js/chat.js \
            assets/js/videos-marketplace.js \
            assets/js/admin.js \
            verify.html \
            assets/js/announcements.js
          if git diff --cached --quiet; then
            echo 'No hardening changes to commit.'
            exit 0
          fi
          git commit -m 'Apply repo hardening fixes'
          git push origin HEAD:main
