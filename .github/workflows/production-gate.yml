name: Production gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=$(find netlify/functions -type f -name '*.js' -print)
          for file in $files; do
            node --check "$file"
          done

      - name: Validate site configuration
        run: node scripts/validate-production-config.mjs
