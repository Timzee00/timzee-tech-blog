name: Production gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          # Netlify Functions use CommonJS.
          while IFS= read -r file; do
            node --check "$file"
          done < <(find netlify/functions -type f -name '*.js' -print)

          # Browser scripts are ES modules but keep the .js extension. Copy each
          # to a temporary .mjs file so Node parses it with module semantics.
          tmp_root=$(mktemp -d)
          trap 'rm -rf "$tmp_root"' EXIT
          while IFS= read -r file; do
            tmp_file="$tmp_root/$(basename "$file").mjs"
            cp "$file" "$tmp_file"
            node --check "$tmp_file"
          done < <(find assets -type f -name '*.js' -print)

          # Repository validation script is explicitly ESM.
          while IFS= read -r file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.mjs' -print)

      - name: Validate site configuration
        run: node scripts/validate-production-config.mjs
