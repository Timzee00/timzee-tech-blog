<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - Timzee Tech Hub</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
      <script defer src="../assets/js/theme-init.js"></script>
  </head>
  <body class="login-shell">
    <main id="main-content" class="login-card">
      <h1>Admin Login</h1>
      <p class="hint">Admins can publish posts and moderate comments. Super admins can see everything.</p>
      <form novalidate id="adminLoginForm" class="admin-form">
        <input type="email" id="username" autocomplete="username" aria-label="Email" placeholder="Admin email" required>
        <input type="password" id="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
        <button class="btn" type="submit">Sign In</button>
      </form>
      <p class="hint" id="loginMessage"></p>
      <p class="hint">Super admin? Use the <a class="switch-link" href="../super/login.html">Super Admin login</a>.</p>
      <p class="hint">Back to <a class="switch-link" href="../index.html">home</a>.</p>
    </main>
    <script type="module" src="../assets/js/admin.js"></script>
  </body>
</html>
