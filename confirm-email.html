<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Confirm your email · Blipmood</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 8% 3%,#145b6670,transparent 45%),radial-gradient(circle at 100% 100%,#273b7a80,transparent 50%),#0b1426;color:#eef7fa;padding:18px}
main{width:min(460px,100%);background:#13273a;border:1px solid #487f8d;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 65px #0006}
.brand{color:#78e5d3;letter-spacing:.02em;text-decoration:none;font-weight:850;font-size:1.5rem}
.kicker{margin-top:30px;color:#82d9f3;font-size:.75rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(1.65rem,5vw,2.15rem);line-height:1.18;margin:10px 0}
p{line-height:1.6;color:#d0dce5}
button{width:100%;min-height:49px;padding:13px 18px;margin-top:15px;border:0;border-radius:999px;background:linear-gradient(110deg,#1bbaaa,#3b8edd);font:750 1rem system-ui,sans-serif;color:white;cursor:pointer}
button:disabled{opacity:.58;cursor:wait}
button:focus-visible,a:focus-visible{outline:3px solid #96ffec;outline-offset:3px}
#confirmEmailStatus{min-height:20px;margin-top:18px;overflow-wrap:anywhere}
#confirmEmailStatus[data-error=true]{color:#ffbabc}
.secondary{font-size:.9rem}
.secondary a{color:#a5f3e8}
</style>
</head>
<body>
<main>
<a href="/" class="brand" aria-label="Blipmood home">Blipmood</a>
<div class="kicker">Just one more step</div>
<h1>Confirm your email</h1>
<p>Confirm your address to activate your Blipmood account. Then you'll go straight to your three-step profile setup.</p>
<button type="button" id="confirmEmailButton" disabled>Verify email &amp; continue</button>
<p id="confirmEmailStatus" role="status" aria-live="polite">Checking your confirmation link…</p>
<p class="secondary">Link expired or already confirmed? <a href="/login.html">Sign in instead</a>.</p>
</main>
<script type="module" src="/assets/js/confirm-email.mjs"></script>
</body>
</html>
