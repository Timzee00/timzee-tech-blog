<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maintenance — Timzee Tech Hub</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --card:#fff; --ink:#16181d; --muted:#626a78; --accent:#2563eb; --border:#dfe4ec; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#151b23; --ink:#eef2f7; --muted:#9aa5b5; --border:#26303c; } }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(37,99,235,.10),transparent 44%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(600px,calc(100vw - 32px));padding:34px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.1)}.chip{display:inline-block;padding:6px 10px;border:1px solid var(--border);border-radius:999px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{margin:16px 0 10px;font-size:clamp(1.8rem,5vw,2.5rem)}p{margin:0 0 22px;color:var(--muted)}a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:11px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="chip">Planned maintenance</span>
    <h1>We’ll be back shortly.</h1>
    <p>Timzee Tech Hub is temporarily unavailable while we work on the service. Existing account data is stored separately from the website and isn’t affected by this page.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
