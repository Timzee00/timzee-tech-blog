[build]
  ignore = "node ./scripts/netlify-ignore-build.mjs"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev --ignore-scripts"

[functions."scout-news"]
  schedule = "0 * * * *"

[functions."automation-maintenance"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true
