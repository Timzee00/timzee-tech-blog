<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsletter - Timzee Tech Hub</title>
    <meta name="description" content="Subscribe to the Timzee Tech Hub newsletter for curated tech stories and updates.">
    <meta name="keywords" content="Timzee Tech Hub newsletter, tech updates, curated tech news">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f766e">
    <link rel="canonical" href="https://timzee-tech-blog.netlify.app/newsletter.html">
    <meta property="og:site_name" content="Timzee Tech Hub">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Newsletter - Timzee Tech Hub">
    <meta property="og:description" content="Subscribe to the Timzee Tech Hub newsletter for curated tech stories and updates.">
    <meta property="og:url" content="https://timzee-tech-blog.netlify.app/newsletter.html">
    <meta property="og:image" content="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Newsletter - Timzee Tech Hub">
    <meta name="twitter:description" content="Subscribe to the Timzee Tech Hub newsletter for curated tech stories and updates.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
      <script defer src="assets/js/theme-init.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container wrap">
        <div class="brand">
          <a class="logo" href="index.html" id="siteName">Timzee <span>Tech</span> Hub</a>
          <div class="tagline">Weekly insights from the Timzee newsroom</div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container">
        <section class="post-shell" data-reveal>
          <h1>Newsletter</h1>
          <p class="tagline">Join executives, product leaders, and founders who read the Timzee digest.</p>
          <form class="form-grid" style="margin-top:20px;" id="newsletterForm">
            <input type="text" name="name" placeholder="Full name" required>
            <input type="email" name="email" placeholder="Work email" required>
            <select name="interest" required>
              <option value="">Primary interest</option>
              <option>Product updates</option>
              <option>Engineering insights</option>
              <option>Industry news</option>
              <option>Community highlights</option>
            </select>
            <button class="btn" type="submit">Join Newsletter</button>
          </form>
          <div class="callout" id="newsletterStatus" style="margin-top:18px; display:none;"></div>
          <div class="callout" style="margin-top:12px;">We send 2 emails per month. Unsubscribe anytime.</div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-links">
          <a href="support.html">Support</a>
          <a href="contact.html">Contact Us</a>
          <a href="ads.html">Advertise</a>
          <a href="discussion.html">Discussion</a>
        </div>
      </div>
    </footer>

    <script type="module" src="assets/js/forms.js"></script>
  </body>
</html>
