<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novel - Timzee Tech Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
      .novel-header { background: linear-gradient(135deg, #0f766e, #14b8a6); color: white; padding: 40px 0; }
      .novel-cover-section { display: grid; grid-template-columns: 200px 1fr; gap: 30px; margin-bottom: 30px; }
      @media (max-width: 768px) { .novel-cover-section { grid-template-columns: 1fr; } }
      .novel-cover-img { width: 200px; height: 300px; background: #fff; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 64px; }
      .novel-cover-img img { width: 100%; height: 100%; object-fit: cover; }
      .novel-details h1 { margin: 0 0 10px 0; font-size: 28px; }
      .novel-meta-info { display: flex; gap: 20px; margin: 20px 0; font-size: 14px; flex-wrap: wrap; }
      .novel-stat { display: flex; align-items: center; gap: 8px; }
      .novel-status-badge { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 20px; width: fit-content; }
      .chapters-list { background: white; border-radius: 8px; overflow: hidden; margin-top: 20px; }
      .chapter-header { padding: 16px; background: #f9fafb; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
      .chapter-item { padding: 16px; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
      .chapter-item:hover { background: #f0fdfa; }
      .chapter-title { font-weight: 500; }
      .chapter-published { font-size: 12px; color: #999; }
      .actions-bar { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
      .btn-icon { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 6px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 600; transition: all 0.2s; }
      .btn-icon:hover { background: #f9fafb; border-color: #0f766e; }
      .btn-icon.primary { background: #0f766e; color: white; border-color: #0f766e; }
      .btn-icon.primary:hover { background: #0d5f5a; }
      .edit-btn { display: inline-flex; align-items: center; gap: 8px; }
      .chapter-form { background: #f9fafb; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
      .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; }
      .form-group textarea { min-height: 200px; resize: vertical; }
      .char-count { font-size: 12px; color: #999; margin-top: 4px; }
      .reader-content { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; line-height: 1.9; font-size: 16px; }
      .reader-content p { margin-bottom: 20px; }
      .reader-content h2 { margin: 30px 0 15px 0; }
      .nav-chapters { display: flex; gap: 12px; justify-content: space-between; margin: 30px 0; }
      .nav-btn { padding: 10px 16px; background: #0f766e; color: white; border: none; border-radius: 6px; cursor: pointer; }
      .no-more { color: #999; padding: 10px; }
      .comment-form { margin-top: 20px; padding: 20px; background: #f9fafb; border-radius: 8px; }
      .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
      .modal.active { display: flex; }
      .modal-content { background: white; border-radius: 8px; padding: 24px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
      .modal-close { float: right; font-size: 24px; cursor: pointer; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container wrap">
        <div class="brand">
          <a class="logo" href="index.html" id="siteName">Timzee <span>Tech</span> Hub</a>
          <div class="tagline">Stories & Serialized Fiction</div>
        </div>
        <nav class="nav-pill">
          <a href="novels.html">Novels</a>
          <a href="discussion.html">Discussion</a>
          <a href="chat.html">Chat</a>
        </nav>
        <div class="header-actions" id="authActions"></div>
      </div>
    </header>

    <main class="page-shell">
      <!-- Novel Header -->
      <section class="novel-header">
        <div class="container">
          <div class="novel-cover-section">
            <div class="novel-cover-img" id="coverImg">📖</div>
            <div class="novel-details">
              <h1 id="novelTitle">Loading...</h1>
              <div id="authorInfo">By <span id="authorName">Loading</span></div>
              <div class="novel-meta-info">
                <div class="novel-stat">📕 <span id="chapterCount">0</span> chapters</div>
                <div class="novel-stat">👁 <span id="viewCount">0</span> views</div>
                <div class="novel-stat">❤️ <span id="likeCount">0</span> likes</div>
              </div>
              <div class="novel-status-badge">
                <span id="statusBadge">ongoing</span>
              </div>
              <p id="synopsis" style="margin-top: 16px;">Loading...</p>
              <div class="actions-bar">
                <button class="btn-icon primary" id="likeBtn">❤️ Like</button>
                <button class="btn-icon" id="subscribeBtn">🔔 Subscribe</button>
                <button class="btn-icon" id="shareBtn">📤 Share</button>
                <button class="btn-icon edit-btn" id="editBtn" style="display: none;">✏️ Edit</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Chapter Form (Author Only) -->
      <section class="container" id="chapterFormSection" style="display: none; margin-top: 30px;">
        <div class="chapter-form">
          <h3 style="margin-top: 0;">Add New Chapter</h3>
          <form id="chapterForm">
            <div class="form-group">
              <label>Chapter Title *</label>
              <input type="text" id="chapterTitle" placeholder="Chapter 1: The Beginning" required>
            </div>
            <div class="form-group">
              <label>Chapter Content *</label>
              <textarea id="chapterContent" placeholder="Write your chapter here..." required></textarea>
              <div class="char-count"><span id="charCount">0</span> characters</div>
            </div>
            <button type="submit" class="btn-icon primary">Publish Chapter</button>
            <button type="button" class="btn-icon" id="cancelChapter" style="background: white; border-color: #ddd;">Cancel</button>
            <div id="chapterStatus" style="margin-top: 12px; display: none;"></div>
          </form>
        </div>
      </section>

      <!-- Content View -->
      <section class="container" id="contentSection">
        <!-- Chapters List -->
        <div id="chaptersView">
          <div class="chapters-list">
            <div class="chapter-header">Chapters</div>
            <div id="chaptersList">
              <div style="padding: 16px; text-align: center; color: #999;">No chapters yet</div>
            </div>
          </div>
        </div>

        <!-- Chapter Reader -->
        <div id="readerView" style="display: none;">
          <div class="nav-chapters">
            <button class="nav-btn" id="prevBtn">← Previous</button>
            <a href="#" class="btn-icon ghost" id="backToChapters" style="border: none; background: none; color: #0f766e;">Back to Chapters</a>
            <button class="nav-btn" id="nextBtn">Next →</button>
          </div>
          <div class="reader-content" id="readerContent">Loading...</div>
          <div class="nav-chapters">
            <button class="nav-btn" id="prevBtn2">← Previous</button>
            <button class="nav-btn" id="nextBtn2">Next →</button>
          </div>

          <!-- Comments Section -->
          <div class="container" style="max-width: 800px; margin: 40px auto;">
            <h3>Comments</h3>
            <form class="comment-form" id="commentForm" style="display: none;">
              <textarea id="commentBody" placeholder="Share your thoughts..."></textarea>
              <button type="submit" class="btn-icon primary" style="margin-top: 12px;">Post Comment</button>
              <div id="commentStatus" style="margin-top: 8px; display: none;"></div>
            </form>
            <div id="commentsList"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-links">
          <a href="novels.html">Novels</a>
          <a href="discussion.html">Discussion</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
      <div class="modal-content">
        <span class="modal-close" id="closeModal">&times;</span>
        <h2>Edit Novel</h2>
        <form id="editForm">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="editTitle">
          </div>
          <div class="form-group">
            <label>Synopsis</label>
            <textarea id="editSynopsis"></textarea>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="editStatus">
              <option value="ongoing">Ongoing</option>
              <option value="completed">Completed</option>
              <option value="paused">On Hiatus</option>
            </select>
          </div>
          <button type="submit" class="btn-icon primary">Save Changes</button>
          <button type="button" class="btn-icon" id="closeEditBtn" style="background: white; border-color: #ddd;">Cancel</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { supabase, getCurrentUser, getDisplayName, signOut } from "./assets/js/supabase.js";
      import { fetchSettings } from "./assets/js/settings.js";

      const params = new URLSearchParams(window.location.search);
      const novelId = params.get("id");

      let state = {
        user: null,
        novel: null,
        chapters: [],
        currentChapterIndex: -1,
        isAuthor: false
      };

      async function init() {
        if (!novelId) {
          window.location.href = "novels.html";
          return;
        }

        state.user = await getCurrentUser();
        setupAuth();
        await loadNovel();
        await loadChapters();
        setupEventListeners();
      }

      function setupAuth() {
        const authActions = document.getElementById("authActions");
        if (!authActions) return;

        if (state.user) {
          authActions.innerHTML = `
            <span class="auth-meta">${getDisplayName(state.user)}</span>
            <a class="btn ghost" href="profile.html">Profile</a>
            <button class="btn ghost" id="logoutBtn">Log Out</button>
          `;
          document.getElementById("logoutBtn").addEventListener("click", async () => {
            await signOut();
            window.location.reload();
          });
          if (state.commentForm) document.getElementById("commentForm").style.display = "block";
        } else {
          authActions.innerHTML = `<a class="btn ghost" href="login.html?next=novel.html%3Fid%3D${novelId}">Log In</a>`;
        }
      }

      async function loadNovel() {
        try {
          const { data, error } = await supabase.from("novels").select("*").eq("id", novelId).single();
          if (error) throw error;

          state.novel = data;
          state.isAuthor = state.user?.id === data.author_id;

          // Update UI
          document.getElementById("novelTitle").textContent = data.title;
          document.getElementById("authorName").textContent = data.author_name;
          document.getElementById("chapterCount").textContent = data.chapters_count || 0;
          document.getElementById("viewCount").textContent = data.views || 0;
          document.getElementById("likeCount").textContent = data.likes || 0;
          document.getElementById("statusBadge").textContent = data.status;
          document.getElementById("synopsis").textContent = data.synopsis;

          if (data.cover_url) {
            document.getElementById("coverImg").innerHTML = `<img src="${data.cover_url}" alt="${data.title}">`;
          }

          // Show edit button and chapter form for author
          if (state.isAuthor) {
            document.getElementById("editBtn").style.display = "flex";
            document.getElementById("chapterFormSection").style.display = "block";
          }
        } catch (error) {
          console.error("Load error:", error);
          document.getElementById("contentSection").innerHTML = "<p>Novel not found</p>";
        }
      }

      async function loadChapters() {
        try {
          const { data, error } = await supabase
            .from("chapters")
            .select("*")
            .eq("novel_id", novelId)
            .order("chapter_number", { ascending: true });

          if (error) throw error;

          state.chapters = data || [];
          renderChaptersList();
        } catch (error) {
          console.error("Chapters load error:", error);
        }
      }

      function renderChaptersList() {
        const list = document.getElementById("chaptersList");
        
        if (!state.chapters.length) {
          list.innerHTML = `<div style="padding: 16px; text-align: center; color: #999;">${state.isAuthor ? "No chapters yet. Create one!" : "No chapters published yet"}</div>`;
          return;
        }

        list.innerHTML = state.chapters.map((ch, idx) => `
          <div class="chapter-item" onclick="readChapter(${idx})">
            <div>
              <div class="chapter-title">Chapter ${ch.chapter_number}: ${ch.title}</div>
              <div class="chapter-published">${new Date(ch.created_at).toLocaleDateString()}</div>
            </div>
            <div style="text-align: right; color: #999; font-size: 12px;">${ch.word_count || 0} words</div>
          </div>
        `).join("");
      }

      function setupEventListeners() {
        // Like button
        document.getElementById("likeBtn")?.addEventListener("click", async () => {
          if (!state.user) {
            window.location.href = `login.html?next=novel.html%3Fid%3D${novelId}`;
            return;
          }
          // TODO: Implement like functionality with likes table
          alert("Like functionality coming soon!");
        });

        // Edit button
        document.getElementById("editBtn")?.addEventListener("click", () => {
          if (state.isAuthor) {
            document.getElementById("editTitle").value = state.novel.title;
            document.getElementById("editSynopsis").value = state.novel.synopsis;
            document.getElementById("editStatus").value = state.novel.status;
            document.getElementById("editModal").classList.add("active");
          }
        });

        // Close modal
        document.getElementById("closeModal")?.addEventListener("click", () => {
          document.getElementById("editModal").classList.remove("active");
        });

        // Edit form submit
        document.getElementById("editForm")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const { error } = await supabase.from("novels").update({
            title: document.getElementById("editTitle").value,
            synopsis: document.getElementById("editSynopsis").value,
            status: document.getElementById("editStatus").value
          }).eq("id", novelId);

          if (!error) {
            document.getElementById("editModal").classList.remove("active");
            await loadNovel();
          }
        });

        // Chapter form
        document.getElementById("chapterForm")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          
          const status = document.getElementById("chapterStatus");
          const btn = document.querySelector("#chapterForm button[type='submit']");
          btn.disabled = true;
          status.style.display = "block";
          status.textContent = "Publishing...";
          status.style.color = "#0f766e";

          try {
            const content = document.getElementById("chapterContent").value;
            const chapter = {
              id: crypto.randomUUID(),
              novel_id: novelId,
              chapter_number: state.chapters.length + 1,
              title: document.getElementById("chapterTitle").value,
              content,
              word_count: content.split(/\s+/).length,
              created_at: new Date().toISOString()
            };

            const { error } = await supabase.from("chapters").insert(chapter);
            if (error) throw error;

            // Update novel chapter count
            await supabase.from("novels").update({
              chapters_count: (state.novel.chapters_count || 0) + 1
            }).eq("id", novelId);

            status.textContent = "✓ Chapter published!";
            status.style.color = "green";
            
            document.getElementById("chapterForm").reset();
            await loadNovel();
            await loadChapters();
            
            setTimeout(() => {
              status.style.display = "none";
              btn.disabled = false;
            }, 2000);
          } catch (error) {
            status.textContent = `Error: ${error.message}`;
            status.style.color = "red";
            btn.disabled = false;
          }
        });

        document.getElementById("cancelChapter")?.addEventListener("click", () => {
          document.getElementById("chapterForm").reset();
        });

        // Character count
        document.getElementById("chapterContent")?.addEventListener("input", (e) => {
          document.getElementById("charCount").textContent = e.target.value.length;
        });
      }

      window.readChapter = function(index) {
        state.currentChapterIndex = index;
        const chapter = state.chapters[index];

        document.getElementById("chaptersView").style.display = "none";
        document.getElementById("readerView").style.display = "block";
        document.getElementById("readerContent").innerHTML = `
          <h2>Chapter ${chapter.chapter_number}: ${chapter.title}</h2>
          <div style="color: #999; font-size: 14px; margin-bottom: 20px;">${new Date(chapter.created_at).toLocaleDateString()} • ${chapter.word_count || 0} words</div>
          <div>${chapter.content.split('\n').map(p => `<p>${p}</p>`).join('')}</div>
        `;

        // Update nav buttons
        document.getElementById("prevBtn").disabled = index === 0;
        document.getElementById("nextBtn").disabled = index === state.chapters.length - 1;
        document.getElementById("prevBtn2").disabled = index === 0;
        document.getElementById("nextBtn2").disabled = index === state.chapters.length - 1;

        window.scrollTo(0, 0);
      };

      document.getElementById("prevBtn")?.addEventListener("click", () => {
        if (state.currentChapterIndex > 0) readChapter(state.currentChapterIndex - 1);
      });

      document.getElementById("nextBtn")?.addEventListener("click", () => {
        if (state.currentChapterIndex < state.chapters.length - 1) readChapter(state.currentChapterIndex + 1);
      });

      document.getElementById("prevBtn2")?.addEventListener("click", () => {
        if (state.currentChapterIndex > 0) readChapter(state.currentChapterIndex - 1);
      });

      document.getElementById("nextBtn2")?.addEventListener("click", () => {
        if (state.currentChapterIndex < state.chapters.length - 1) readChapter(state.currentChapterIndex + 1);
      });

      document.getElementById("backToChapters")?.addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("chaptersView").style.display = "block";
        document.getElementById("readerView").style.display = "none";
      });

      init();
    </script>
  </body>
</html>
