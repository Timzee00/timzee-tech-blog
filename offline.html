<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>You’re offline — Timzee Tech Hub</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --card:#fff; --ink:#16181d; --muted:#626a78; --accent:#2563eb; --border:#dfe4ec; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#151b23; --ink:#eef2f7; --muted:#9aa5b5; --border:#26303c; } }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,calc(100vw - 32px));padding:32px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.1)}.chip{display:inline-block;padding:6px 10px;border:1px solid var(--border);border-radius:999px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{margin:16px 0 10px;font-size:clamp(1.8rem,5vw,2.5rem)}p{margin:0 0 22px;color:var(--muted)}button{min-height:44px;padding:0 16px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="chip">Connection unavailable</span>
    <h1>You’re offline</h1>
    <p>Timzee Tech Hub can’t reach the server right now. Your device may still be able to reconnect without losing your place.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
