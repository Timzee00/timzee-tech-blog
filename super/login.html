<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>God Mode Login - Timzee Tech Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
  </head>
  <body class="login-shell">
    <div class="login-card">
      <h1>God Mode Login</h1>
      <p class="hint">Super admin controls roles, settings, ads, and platform rules.</p>
      <form id="superLoginForm" class="admin-form">
        <input type="email" id="username" placeholder="Super admin email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="btn" type="submit">Enter Control Room</button>
      </form>
      <p class="hint" id="loginMessage"></p>
      <p class="hint">Need normal admin? Use the <a class="switch-link" href="../admin/login.html">admin login</a>.</p>
      <p class="hint">Back to <a class="switch-link" href="../index.html">home</a>.</p>
    </div>
    <script type="module" src="../assets/js/super.js"></script>
  </body>
</html>
