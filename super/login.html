<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Admin Login - Timzee Tech Hub</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
      <script defer src="../assets/js/theme-init.js"></script>
  </head>
  <body class="login-shell">
    <main id="main-content" class="login-card">
      <a href="../index.html" class="bm-staff-login-brand" aria-label="Blipmood — Home"><img src="/assets/brand/blipmood-mark.svg" width="40" height="40" alt="">Blipmood</a>
      <h1>Super Admin Login</h1>
      <p class="hint">Super admin controls roles, settings, ads, and platform rules.</p>
      <form novalidate id="superLoginForm" class="admin-form">
        <input type="email" id="username" autocomplete="username" aria-label="Email" placeholder="Super admin email" required>
        <input type="password" id="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
        <button class="btn" type="submit">Enter Control Room</button>
      </form>
      <p class="hint" id="loginMessage"></p>
      <p class="hint">Need normal admin? Use the <a class="switch-link" href="../admin/login.html">admin login</a>.</p>
      <p class="hint">Back to <a class="switch-link" href="../index.html">home</a>.</p>
    </main>
    <script type="module" src="../assets/js/super.js"></script>
  </body>
</html>
