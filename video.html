    <link rel="stylesheet" href="assets/css/content-polls.css">
    <script type="module">
      import {
        fetchVideos,
        fetchVideoById,
        likeVideo,
        isVideoLiked,
        getVideoLikeCount,
        commentOnVideo,
        getVideoComments,
        fetchVideoCommentPage,
        incrementVideoView,
        uploadVideo,
        detectVideoDuration,
        isSupportedVideoFile,
        captureVideoThumbnail
      } from "./assets/js/videos-marketplace.js";
      import { supabase, getCurrentUser } from "./assets/js/supabase.js";
      import { loadUserPreferences, mergePreferences } from "./assets/js/user-preferences.js";
      import { fetchVideoDiscoveryPage } from "./assets/js/video-discovery.mjs";
      import { escapeHTML, isSafeUrl } from "./assets/js/utils.js";
      import {setupMentionInput} from "./assets/js/mentions.js";
      import {renderSocialText} from "./assets/js/social-rich-text.mjs";
      import {mountPoll,openPollComposer} from "./assets/js/content-polls.mjs";
      import { notifyVideoLike, notifyVideoComment } from "./assets/js/data.js";
      import {verifiedName,verifiedAvatar,verifiedCommentClass,loadVerifiedIdentityMap,publicIdentityName} from "./assets/js/verified-identity.mjs";

      const root = document.getElementById("reelRoot");
      const params = new URLSearchParams(window.location.search);
      const startId = params.get("id");

      const state = {
        user: null,
        preferences: mergePreferences(),
        sessionMuted: false,
        videos: [],
        offset: 0,
        limit: 6,
        mode: params.get("mode") === "following" ? "following" : "for-you",
        generation: 0,
        loadingMore: false,
        exhausted: false,
        activeIndex: 0,
        likedCache: {},
        commentsOpenFor: null,
        viewAttempts: new Set(),
        viewRetryAfter: new Map()
      };


      // Keep the reel feed at its pre-keyboard height while comments are open.
      // Android browsers can otherwise retain a partial snap after the keyboard closes.
      let reelHeight = 0;
      let reelViewportTimer = null;
      function syncReelViewport() {
        if (state.commentsOpenFor || document.getElementById("reelUploadDialog").open) return;
        if (document.activeElement?.matches?.("input,textarea,[contenteditable]")) return;
        const height = Math.round(window.innerHeight || 0);
        if (!height || height < 300) return;
        // Skip a transient keyboard-sized viewport in portrait; the final resize
        // event after keyboard dismissal will re-align the active reel.
        if (reelHeight && height < reelHeight - 130 && window.matchMedia("(orientation: portrait)").matches) return;
        document.documentElement.style.setProperty("--reel-screen-height", height + "px");
        if (reelHeight !== height) {
          reelHeight = height;
          const scroller = document.getElementById("scroller");
          if (scroller) scroller.scrollTop = state.activeIndex * scroller.clientHeight;
        }
      }
      function scheduleReelViewportSync() {
        clearTimeout(reelViewportTimer);
        reelViewportTimer = setTimeout(syncReelViewport, 180);
      }
      window.addEventListener("resize", scheduleReelViewportSync, {passive:true});
      window.visualViewport?.addEventListener("resize", scheduleReelViewportSync, {passive:true});
      window.addEventListener("orientationchange", () => {
        reelHeight = 0;
        scheduleReelViewportSync();
      }, {passive:true});
      syncReelViewport();

      const headerMute = document.getElementById("reelHeaderMute");
      function syncHeaderMute() {
        headerMute.textContent = state.sessionMuted ? "🔇" : "🔊";
        headerMute.setAttribute("aria-label", state.sessionMuted ? "Unmute videos" : "Mute videos");
        headerMute.setAttribute("aria-pressed", String(state.sessionMuted));
      }
      headerMute.addEventListener("click", () => {
        state.sessionMuted = !state.sessionMuted;
        try { sessionStorage.setItem("timzee:reels-muted", String(state.sessionMuted)); } catch {}
        document.querySelectorAll(".reel-video").forEach(video => { video.muted = state.sessionMuted; });
        syncHeaderMute();
      });
      document.getElementById("reelHeaderBack").addEventListener("click", event => {
        try {
          const previous = document.referrer ? new URL(document.referrer) : null;
          if (previous && previous.origin === location.origin && history.length > 1) {
            event.preventDefault();
            history.back();
          }
        } catch {}
      });

      // The creator is a real inline uploader, sharing the existing Supabase
      // uploadVideo() implementation with the full Videos page.
      const uploadDialog = document.getElementById("reelUploadDialog");
      const uploadForm = document.getElementById("reelUploadForm");
      const uploadFile = document.getElementById("reelUploadFile");
      const uploadPreview = document.getElementById("reelUploadPreview");
      const uploadStatus = document.getElementById("reelUploadStatus");
      const uploadSubmit = document.getElementById("reelUploadSubmit");
      let uploadBusy = false;
      let uploadPreviewUrl = null;
      let resumeAfterUpload = false;
      function releaseUploadPreview() {
        uploadPreview.pause();
        uploadPreview.removeAttribute("src");
        uploadPreview.load();
        uploadPreview.hidden = true;
        if (uploadPreviewUrl) URL.revokeObjectURL(uploadPreviewUrl);
        uploadPreviewUrl = null;
      }
      document.getElementById("reelOpenUpload").addEventListener("click", () => {
        if (uploadDialog.open) return;
        if (state.commentsOpenFor) {
          resumeAfterComments = false;
          closeComments();
        }
        // Don't replace a draft or change the selected reel when composing.
        const playing = document.getElementById("video-" + state.activeIndex);
        resumeAfterUpload = Boolean(playing && !playing.paused);
        document.querySelectorAll(".reel-video").forEach(video => video.pause());
        document.getElementById("reelUploadSignin").hidden = Boolean(state.user);
        uploadForm.hidden = !state.user;
        document.getElementById("reelUploadLogin").href =
          "login.html?next=" + encodeURIComponent(location.href);
        uploadDialog.showModal();
        if (state.user) uploadFile.focus();
      });
      document.getElementById("reelUploadClose").addEventListener("click", () => {
        if (!uploadBusy) uploadDialog.close();
      });
      uploadDialog.addEventListener("cancel", event => {
        if (uploadBusy) event.preventDefault();
      });
      uploadDialog.addEventListener("close", () => {
        releaseUploadPreview();
        uploadStatus.textContent = "";
        document.getElementById("reelOpenUpload").focus({preventScroll:true});
        if (resumeAfterUpload) {
          const active = document.getElementById("video-" + state.activeIndex);
          if (active) playWithSoundFallback(active, state.activeIndex, {explicit:true});
        }
        resumeAfterUpload = false;
        scheduleReelViewportSync();
      });
      uploadFile.addEventListener("change", () => {
        releaseUploadPreview();
        uploadStatus.textContent = "";
        const file = uploadFile.files?.[0];
        if (!file) return;
        if (!file.size || !isSupportedVideoFile(file)) {
          uploadStatus.textContent = "Choose a valid non-empty video file.";
          return;
        }
        uploadPreviewUrl = URL.createObjectURL(file);
        uploadPreview.src = uploadPreviewUrl;
        uploadPreview.hidden = false;
        if (!document.getElementById("reelUploadName").value.trim()) {
          document.getElementById("reelUploadName").value =
            file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 150);
        }
      });

      const captureReelCover=captureVideoThumbnail;

      uploadForm.addEventListener("submit", async event => {
        event.preventDefault();
        if (uploadBusy || !state.user) return;
        if (!uploadForm.reportValidity()) return;
        const file = uploadFile.files?.[0];
        if (!file?.size || !isSupportedVideoFile(file)) {
          uploadStatus.textContent = "Choose a valid non-empty video file.";
          return;
        }
        const cover = document.getElementById("reelUploadCover").files?.[0] || null;
        if (cover && (!cover.type.startsWith("image/") || cover.size > 10 * 1024 * 1024)) {
          uploadStatus.textContent = "Cover must be an image under 10 MB.";
          return;
        }
        const title = document.getElementById("reelUploadName").value.trim();
        const description = document.getElementById("reelUploadCaption").value.trim();
        if (!title || title.length > 150 || description.length > 3000) {
          uploadStatus.textContent = "Enter a title (up to 150 characters) and a caption under 3000 characters.";
          return;
        }
        const tags = [...new Set(document.getElementById("reelUploadTags").value
          .split(/[\s,]+/).map(t => t.trim().replace(/^#/, "").toLowerCase())
          .filter(t => /^[a-z0-9_]{1,32}$/.test(t)))].slice(0, 20);
        uploadBusy = true;
        uploadSubmit.disabled = true;
        uploadSubmit.textContent = "Publishing…";
        try {
          uploadStatus.textContent = "Preparing video and cover…";
          const [duration, thumbnail] = await Promise.all([
            detectVideoDuration(file),
            cover ? Promise.resolve(cover) : captureReelCover(file)
          ]);
          uploadStatus.textContent = "Uploading your reel… Keep this window open.";
          const uploaderProfile=await supabase.from("public_profiles").select("username,display_name").eq("id",state.user.id).maybeSingle();
          const uploaderPublicName=publicIdentityName(uploaderProfile.data);
          const result = await uploadVideo(
            state.user.id,
            uploaderPublicName,
            file, thumbnail,
            {
              title, description,
              category: document.getElementById("reelUploadCategory").value,
              tags,
              duration,
              allow_comments: document.getElementById("reelUploadComments").checked,
              allow_download: document.getElementById("reelUploadDownloads").checked
            }
          );
          if (result?.error || !result?.data?.id) {
            throw new Error(typeof result?.error === "string" ? result.error :
              (result?.error?.message || "The server did not confirm the upload."));
          }
          uploadStatus.textContent = "Reel published successfully!";
          uploadForm.reset();
          uploadDialog.close();
          window.appUI?.toast?.("Your reel was published successfully!");
          // Keep the viewer on the same reel rather than replacing the feed.
        } catch (error) {
          uploadStatus.textContent = "Upload failed: " + String(error?.message || "Please try again.");
          console.warn("Reel upload failed:", error);
        } finally {
          uploadBusy = false;
          uploadSubmit.disabled = false;
          uploadSubmit.textContent = "Publish reel";
        }
      });

      const reelEditor=document.getElementById("reelEditor"),reelForm=document.getElementById("reelEditorForm");
      let editingReelId=null;
      document.getElementById("reelEditorCancel").addEventListener("click",()=>reelEditor.close());
      reelEditor.addEventListener("close",()=>{editingReelId=null;});
      document.addEventListener("click",event=>{
        const edit=event.target.closest("[data-edit-reel]");
        if(!edit)return;
        const reel=state.videos.find(row=>row.id===edit.dataset.editReel);
        if(!reel||!state.user||reel.user_id!==state.user.id)return;
        editingReelId=reel.id;
        document.getElementById("reelEditTitle").value=reel.title||"";
        document.getElementById("reelEditDescription").value=reel.description||"";
        document.getElementById("reelEditStatus").textContent="Changes will be saved only after the server confirms them.";
        reelEditor.showModal();
      });
      reelForm.addEventListener("submit",async event=>{
        event.preventDefault();
        const reel=state.videos.find(row=>row.id===editingReelId);
        if(!reel||!state.user||reel.user_id!==state.user.id)return;
        const title=document.getElementById("reelEditTitle").value.trim(),
          description=document.getElementById("reelEditDescription").value.trim(),
          resultStatus=document.getElementById("reelEditStatus"),
          save=document.getElementById("reelEditorSave");
        if(!title||title.length>150||description.length>3000){resultStatus.textContent="Enter a title and keep the caption within the limit.";return;}
        save.disabled=true;resultStatus.textContent="Saving…";
        try{
          const result=await supabase.from("videos").update({title,description})
            .eq("id",reel.id).eq("user_id",state.user.id).select("id,title,description").maybeSingle();
          if(result.error)throw result.error;
          if(!result.data||result.data.id!==reel.id||result.data.title!==title||result.data.description!==description)
            throw Error("The database did not confirm your changes. Nothing has been marked saved.");
          reel.title=title;reel.description=description;
          state.videos.forEach((item,index)=>{
            if(item.id!==reel.id)return;
            const caption=document.getElementById("caption-"+index);
            if(caption)caption.innerHTML=renderSocialText(title)+(description?" — "+renderSocialText(description):"");
          });
          resultStatus.textContent="Saved!";
          reelEditor.close();
        }catch(error){resultStatus.textContent="Could not save: "+(error.message||"Please try again");}
        finally{save.disabled=false;}
      });
      function updateReelModeButtons() {
        document.querySelectorAll("[data-reel-mode]").forEach(button => {
          const active = button.dataset.reelMode === state.mode;
          button.classList.toggle("active",active);
          button.setAttribute("aria-pressed",String(active));
        });
      }
      async function fetchModePage(offset) {
        return fetchVideoDiscoveryPage(supabase,{
          mode: state.mode, userId: state.user?.id, offset, limit: state.limit
        });
      }
      document.querySelectorAll("[data-reel-mode]").forEach(button => button.addEventListener("click",async () => {
        if (button.dataset.reelMode===state.mode) return;
        state.mode=button.dataset.reelMode;
        state.generation++;
        state.offset=0; state.exhausted=false;
        state.videos=[];
        observer?.disconnect();
        document.querySelectorAll(".reel-video").forEach(video=>video.pause());
        updateReelModeButtons();
        history.replaceState({}, "", "video.html?mode="+encodeURIComponent(state.mode));
        await bootFeed(false);
      }));
      updateReelModeButtons();

      function renderLoading() {
        root.innerHTML = `<div class="reel-loading">Loading videos…</div>`;
      }

      function renderEmpty() {
        root.innerHTML = `
          <div class="reel-empty">
            <div>
              <div style="font-size:32px; margin-bottom:10px;">📹</div>
              <div>${state.mode==="following" ? "Follow video creators to see their posts here." : "No recommended videos yet. Explore recent uploads."}</div>
              <a href="videos.html" style="color:#7dd3fc; display:inline-block; margin-top:10px;">← Back to Videos</a>
            </div>
          </div>
        `;
      }

      function initials(name) {
        return (name || "?").trim().slice(0, 1).toUpperCase();
      }

      function itemTemplate(video, index) {
        const profile=video.uploader_profile||null;
        const uploaderName = publicIdentityName(profile,video.author_name||"Member");
        const avatarMarkup=verifiedAvatar(profile?.avatar_url,profile,{size:"sm",alt:""});
        const uploaderMarkup=verifiedName("@"+uploaderName,profile,{compact:true})
          .replace(/^(<span\b[^>]*>)([^<]*)/, '$1<span class="reel-handle-text">$2</span>');
        const staff = video.uploader_staff_pick
          ? '<span class="reel-staff">★ Staff Pick</span>'
          : '';
        const tags = (video.tags || [])
          .filter(t=>/^[a-z0-9_]{1,32}$/i.test(String(t)))
          .slice(0, 6)
          .map((t) => `<a class="reel-tag" href="hashtags.html?tag=${encodeURIComponent(t)}">#${escapeHTML(t)}</a>`)
          .join(" ");
        const poster = video.thumbnail_url && isSafeUrl(video.thumbnail_url) ? video.thumbnail_url : "";
        const src = isSafeUrl(video.video_url) ? video.video_url : "";

        return `
          <div class="reel-item" data-index="${index}" data-id="${escapeHTML(video.id)}">
            <div class="reel-progress" id="progresstrack-${index}"><div class="reel-progress-fill" id="progress-${index}"></div></div>
            <div class="reel-scrub-time" id="scrubtime-${index}">0:00</div>
            <div class="reel-buffer-spinner" id="spinner-${index}"></div>
            <video class="reel-video" id="video-${index}" ${poster ? `poster="${escapeHTML(poster)}"` : ""} playsinline loop preload="none" data-video-src="${escapeHTML(src)}"></video>
            <div class="reel-vignette"></div>
            <div class="reel-tapzone" aria-hidden="true"></div>
            <div class="reel-pause-flash" id="pauseflash-${index}">▶</div>

            <div class="reel-bottom">
              <div class="reel-meta">
                <div class="reel-creator-flags" aria-label="Recognition and editing controls">
                  ${staff}
                  ${state.user?.id===video.user_id?'<button type="button" class="reel-edit-caption" data-edit-reel="'+escapeHTML(video.id)+'" aria-label="Edit my reel caption">✎ Edit</button>':''}
                </div>
                <div class="reel-uploader">
                  <a class="reel-avatar-frame" href="profile.html?id=${encodeURIComponent(video.user_id || '')}" aria-label="View uploader profile">${avatarMarkup}</a>
                  <span class="reel-username" title="@${escapeHTML(uploaderName)}">${uploaderMarkup}</span>
                </div>
                <p class="reel-caption" id="caption-${index}">${renderSocialText(video.title || "")}${video.description ? " — " + renderSocialText(video.description) : ""}</p>
                <button type="button" class="reel-caption-more" data-action="expand-caption" data-index="${index}" aria-expanded="false">More caption</button>
                <div class="reel-tags">${tags}</div>
              </div>
              <div class="reel-rail">
                <button type="button" aria-label="Like video" class="reel-chip" data-action="like" data-id="${escapeHTML(video.id)}" data-index="${index}">
                  <div class="reel-chip-icon">♥</div>
                  <span class="reel-chip-count" id="likecount-${index}">${video.like_count ?? 0}</span>
                </button>
                <button type="button" aria-label="View video comments" class="reel-chip" data-action="comment" data-id="${escapeHTML(video.id)}">
                  <div class="reel-chip-icon">💬</div>
                  <span class="reel-chip-count" id="commentcount-${index}">${Number(video.comment_count||0)}</span>
                </button>
                <button type="button" aria-label="Rewind video 10 seconds" class="reel-chip" data-action="rewind" data-index="${index}">
                  <div class="reel-chip-icon">↺</div><span class="reel-chip-count">10s back</span>
                </button>
                <button type="button" aria-label="Share video" class="reel-chip" data-action="share" data-id="${escapeHTML(video.id)}">
                  <div class="reel-chip-icon">↗</div>
                  <span class="reel-chip-count">Share</span>
                </button>
                <button type="button" aria-label="Save video" class="reel-chip" data-action="download" ${video.allow_download===false?"hidden":""} data-id="${escapeHTML(video.id)}" data-url="${escapeHTML(video.video_url || '')}" data-title="${escapeHTML(video.title || 'video')}">
                  <div class="reel-chip-icon">⬇</div>
                  <span class="reel-chip-count">Save</span>
                </button>
                <div class="reel-chip">
                  <div class="reel-chip-icon" style="font-size:15px;">👁</div>
                  <span class="reel-chip-count" id="viewcount-${index}">${Math.max(0,Number(video.view_count)||0)}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function render() {
        if (!state.videos.length) {
          renderEmpty();
          return;
        }
        root.innerHTML = `<div class="reel-scroller" id="scroller">${state.videos
          .map((v, i) => itemTemplate(v, i))
          .join("")}</div>`;
        wireItems();
      }

      // Browsers block unmuted autoplay unless the user already interacted with
      // the page. We try unmuted first (since that's the better experience),
      // and only fall back to muted playback if the browser actually rejects it —
      // rather than defaulting every video to muted regardless.
      function playWithSoundFallback(vid, idx, { explicit = false } = {}) {
        if (!explicit && state.preferences.videos.autoplay === false) return;
        // Preserve the viewer's latest mute decision across every reel.
        if (state.commentsOpenFor || document.getElementById("reelUploadDialog")?.open) return;
        vid.muted = state.sessionMuted;
        const attempt = vid.play();
        if (attempt && typeof attempt.catch === "function") {
          attempt.catch(() => {
            // An autoplay policy rejection applies to the whole feed.
            // Preserve the effective sound state for every subsequent reel.
            vid.muted = true;
            state.sessionMuted = true;
            try { sessionStorage.setItem("timzee:reels-muted","true"); } catch {}
            document.querySelectorAll(".reel-video").forEach(item=>{item.muted=true;});
            syncHeaderMute();
            vid.play().catch(() => {});
          });
        }
      }

      let observer;
      function wireItems() {
        const scroller = document.getElementById("scroller");
        if (!scroller) return;

        // Back is handled by the shared header, not by each reel.
        // Whole visual reel receives gestures, including the video above/below
        // its center. Ignore caption/controls/progress so those still work.
        const tapState=new Map();
        scroller.querySelectorAll(".reel-item:not([data-reel-tap-wired])").forEach(item=>{
          item.dataset.reelTapWired="true";
          item.addEventListener("click",e=>{
            if(e.target.closest("button,a,.reel-progress,.reel-caption,.reel-feed-modes,.comment-drawer"))return;
            const idx=item.dataset.index,now=Date.now();
            const previous=tapState.get(idx);
            if(previous && now-previous.at<360){
              clearTimeout(previous.timer);tapState.delete(idx);
              triggerLikeBurst(idx,e);return;
            }
            const timer=setTimeout(()=>{
              tapState.delete(idx);
              const vid=document.getElementById("video-"+idx);
              const flash=document.getElementById("pauseflash-"+idx);
              if(!vid)return;
              if(vid.paused){hydrateNearby(Number(idx));playWithSoundFallback(vid,idx,{explicit:true});flash.textContent="▶";}
              else{vid.pause();flash.textContent="Ⅱ";}
              flash.classList.add("show");
              setTimeout(()=>flash.classList.remove("show"),450);
            },360);
            tapState.set(idx,{at:now,timer});
          });
        });

        // Mute is handled by the shared header and applies to all clips.

        // Expand caption on tap
        scroller.querySelectorAll(".reel-caption:not([data-reel-caption-wired])").forEach((cap) => {

          cap.dataset.reelCaptionWired="true";
          cap.addEventListener("click", (e) => {
            e.stopPropagation();
            if(e.target.closest("a"))return;
            cap.classList.toggle("expanded");
          });
        });

        // Like — single shared implementation used by both the like button
        // and double-tap-to-like, so there's exactly one code path that
        // talks to the backend.
        async function performLike(videoId, idx, { forceLikeOnly = false } = {}) {
          if (!state.user) {
            window.location.href = `login.html?next=${encodeURIComponent(window.location.href)}`;
            return;
          }
          const btn = scroller.querySelector(`[data-action="like"][data-id="${videoId}"]`);
          const countEl = document.getElementById(`likecount-${idx}`);
          if (forceLikeOnly && btn && btn.classList.contains("active")) {
            // Already liked — double-tap just replays the heart burst, no API call.
            return;
          }
          const result = await likeVideo(videoId, state.user.id);
          if (result?.error) {
            window.appUI?.toast?.("Couldn\'t save your like. Please retry.",{tone:"error"});
            console.warn("Video like failed:",result.error?.message||"Unknown error");
            return;
          }
          if (countEl) {
            const current = parseInt(countEl.textContent, 10) || 0;
            countEl.textContent = result.liked ? current + 1 : Math.max(0, current - 1);
          }
          if (btn) btn.classList.toggle("active", result.liked);
          if (result.liked) {
            const video = state.videos.find((v) => v.id === videoId);
            if (video && video.user_id && video.user_id !== state.user.id) {
              const likerProfile=await supabase.from("public_profiles").select("username,display_name").eq("id",state.user.id).maybeSingle();
              const likerName=publicIdentityName(likerProfile.data,state.user.user_metadata?.display_name||"Member");
              notifyVideoLike(video.user_id, likerName, videoId).catch((error) => console.warn("Video-like notification failed:", error));
            }
          }
        }

        function triggerLikeBurst(idx, event) {
          const zone = event.target.closest(".reel-item");
          const item = zone;
          const videoId = item?.dataset.id;
          if (!videoId) return;

          const rect = zone.getBoundingClientRect();
          const x = (event.clientX || rect.left + rect.width / 2) - rect.left;
          const y = (event.clientY || rect.top + rect.height / 2) - rect.top;
          const heart = document.createElement("div");
          heart.className = "reel-heart-burst";
          heart.style.left = `${x}px`;
          heart.style.top = `${y}px`;
          heart.textContent = "❤";
          zone.appendChild(heart);
          heart.addEventListener("animationend", () => heart.remove());

          performLike(videoId, idx, { forceLikeOnly: true }).catch((error) =>
            console.warn("Double-tap like failed:", error)
          );
        }

        scroller.querySelectorAll('[data-action="like"]:not([data-reel-like-wired])').forEach((btn) => {

          btn.dataset.reelLikeWired="true";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            performLike(btn.dataset.id, btn.dataset.index).catch((error) =>
              console.warn("Like failed:", error)
            );
          });
        });

        scroller.querySelectorAll('[data-action="rewind"]:not([data-reel-rewind-wired])').forEach(btn=>{
          btn.dataset.reelRewindWired="true";
          btn.addEventListener("click",event=>{
            event.stopPropagation();
            const idx=btn.dataset.index,video=document.getElementById("video-"+idx);
            if(video && Number.isFinite(video.duration))video.currentTime=Math.max(0,(video.currentTime||0)-10);
          });
        });
        scroller.querySelectorAll('[data-action="expand-caption"]:not([data-reel-expand-wired])').forEach(btn=>{
          btn.dataset.reelExpandWired="true";
          btn.addEventListener("click",event=>{
            event.stopPropagation();
            const caption=document.getElementById("caption-"+btn.dataset.index);
            if(!caption)return;
            const expanded=caption.classList.toggle("expanded");
            btn.textContent=expanded?"Less caption":"More caption";
            btn.setAttribute("aria-expanded",String(expanded));
          });
        });
        // Comment drawer
        scroller.querySelectorAll('[data-action="comment"]:not([data-reel-comment-wired])').forEach((btn) => {

          btn.dataset.reelCommentWired="true";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            openComments(btn.dataset.id);
          });
        });

        // Share
        scroller.querySelectorAll('[data-action="share"]:not([data-reel-share-wired])').forEach((btn) => {

          btn.dataset.reelShareWired="true";
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const videoId = btn.dataset.id;
            const url = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(videoId)}`;
            const video = state.videos.find(item => item.id === videoId);
            const label = btn.querySelector(".reel-chip-count");
            try {
              if (navigator.share) {
                await navigator.share({
                  title: video?.title || "Blipmood video",
                  text: video?.description || "Watch this on Blipmood",
                  url
                });
              } else if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(url);
                if (label) {
                  label.textContent = "Copied!";
                  setTimeout(() => { if(label.isConnected)label.textContent = "Share"; },1500);
                }
              } else {
                await window.appUI.prompt("Copy this link:", url);
              }
            } catch (err) {
              if (err?.name === "AbortError") return;
              if (navigator.clipboard?.writeText) {
                try { await navigator.clipboard.writeText(url); if(label)label.textContent="Copied!"; }
                catch { await window.appUI.prompt("Copy this link:", url); }
              } else await window.appUI.prompt("Copy this link:", url);
            }
          });
        });

        scroller.querySelectorAll('[data-action="download"]:not([data-reel-download-wired])').forEach((btn) => {

          btn.dataset.reelDownloadWired="true";
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const url = btn.dataset.url;
            if (!url) return;
            const label = btn.querySelector(".reel-chip-count");
            const originalLabel = label.textContent;
            label.textContent = "Saving...";
            try {
              const response = await fetch(url);
              const blob = await response.blob();
              const blobUrl = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = blobUrl;
              const safeTitle = (btn.dataset.title || "video").replace(/[^a-z0-9_\-]+/gi, "_").slice(0, 60);
              link.download = `${safeTitle || "video"}.mp4`;
              document.body.appendChild(link);
              link.click();
              link.remove();
              URL.revokeObjectURL(blobUrl);
              label.textContent = "Saved!";
            } catch (err) {
              // Cross-origin storage without CORS headers can block the fetch —
              // fall back to opening it directly so the user can still save manually.
              window.open(url, "_blank");
              label.textContent = "Opened";
            }
            setTimeout(() => { label.textContent = originalLabel; }, 1800);
          });
        });

        // Progress bar: passive update + drag-to-seek + buffering spinner
        scroller.querySelectorAll(".reel-video:not([data-reel-video-wired])").forEach((vid) => {

          vid.dataset.reelVideoWired="true";
          const idx = vid.id.split("-")[1];
          const track = document.getElementById(`progresstrack-${idx}`);
          const fill = document.getElementById(`progress-${idx}`);
          const spinner = document.getElementById(`spinner-${idx}`);
          const scrubTime = document.getElementById(`scrubtime-${idx}`);
          let dragging = false;
          let wasPlayingBeforeDrag = false;

          vid.addEventListener("timeupdate", () => {
            if (dragging) return; // don't fight the drag preview
            if (fill && vid.duration) {
              fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
          });

          // Real buffering indicator — shows while the browser is actually
          // waiting on data, not on a fixed timer.
          vid.addEventListener("waiting", () => spinner?.classList.add("show"));
          vid.addEventListener("playing", () => spinner?.classList.remove("show"));
          vid.addEventListener("canplay", () => spinner?.classList.remove("show"));

          if (!track) return;

          function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60)
              .toString()
              .padStart(2, "0");
            return `${m}:${s}`;
          }

          function seekFromEvent(clientX) {
            const rect = track.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
            const time = ratio * (vid.duration || 0);
            if (fill) fill.style.width = `${ratio * 100}%`;
            if (scrubTime) scrubTime.textContent = formatTime(time);
            return time;
          }

          track.addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            dragging = true;
            wasPlayingBeforeDrag = !vid.paused;
            vid.pause();
            track.classList.add("dragging");
            scrubTime?.classList.add("show");
            track.setPointerCapture(e.pointerId);
            const time = seekFromEvent(e.clientX);
            vid.currentTime = time;
          });

          track.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            const time = seekFromEvent(e.clientX);
            vid.currentTime = time;
          });

          function endDrag(e) {
            if (!dragging) return;
            dragging = false;
            track.classList.remove("dragging");
            scrubTime?.classList.remove("show");
            if (wasPlayingBeforeDrag) playWithSoundFallback(vid, idx, {explicit:true});
          }

          track.addEventListener("pointerup", endDrag);
          track.addEventListener("pointercancel", endDrag);
        });

        // Only attach media sources for the visible reel and immediate
        // neighbours. Mounted videos retain their native HTTP cache while
        // scrolling back; avoid preloading every clip on a long feed.
        function hydrateNearby(index) {
          for (const position of ((state.preferences.videos.dataSaver || state.preferences.performance?.dataSaver || navigator.connection?.saveData) ? [index] : [index-1,index,index+1])) {
            const candidate=document.getElementById(`video-${position}`);
            if(!candidate || candidate.getAttribute("src"))continue;
            const source=candidate.dataset.videoSrc;
            if(!source)continue;
            candidate.src=source;
            candidate.preload=position===index && !state.preferences.videos.dataSaver?"auto":
              state.preferences.videos.dataSaver?"none":"metadata";
            candidate.load();
          }
        }
        // Autoplay active video, pause others
        if (observer) observer.disconnect();
        observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const idx = entry.target.dataset.index;
              const vid = document.getElementById(`video-${idx}`);
              if (!vid) return;
              if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
                state.activeIndex = Number(idx);
                hydrateNearby(Number(idx));
                playWithSoundFallback(vid, idx);
                maybeLoadMore(Number(idx));
              } else {
                vid.pause();
              }
            });
          },
          { root: scroller, threshold: [0, 0.6, 1] }
        );
        scroller.querySelectorAll(".reel-item").forEach(el => {
          observer.observe(el);
          const video=el.querySelector("video");
          if(video && !video.dataset.playViewWired) {
            video.dataset.playViewWired="true";
            let watchTimer=null;
            // Count a real visible watch, not a one-frame autoplay or rapid
            // scroll. Postgres enforces one view per account/video/UTC day.
            video.addEventListener("playing",()=>{
              clearTimeout(watchTimer);
              const videoId=el.dataset.id;
              if(state.viewAttempts.has(videoId)||
                 Date.now()<(state.viewRetryAfter.get(videoId)||0))return;
              watchTimer=setTimeout(async()=>{
                if(video.paused||!video.isConnected||
                  document.visibilityState==="hidden"||
                  state.activeIndex!==Number(el.dataset.index)||
                  state.viewAttempts.has(videoId)||
                  Date.now()<(state.viewRetryAfter.get(videoId)||0))return;
                state.viewAttempts.add(videoId);
                let credited=false;
                try{
                  credited=await incrementVideoView(videoId);
                  const current=state.videos.find(v=>v.id===videoId);
                  if(!current)return;
                  if(credited){
                    // Count only receipts confirmed by the server.
                    current.view_count=Math.max(0,Number(current.view_count)||0)+1;
                    const index=state.videos.indexOf(current);
                    const counter=document.getElementById("viewcount-"+index);
                    if(counter)counter.textContent=String(current.view_count);
                  }else{
                    // Duplicate or failed receipt: reconcile the real server
                    // count and permit a later retry without request storms.
                    state.viewRetryAfter.set(videoId,Date.now()+60000);
                    try{
                      const {data,error}=await supabase.rpc("reel_public_metadata",{p_video_ids:[videoId]});
                      if(!error&&Array.isArray(data)){
                        const stored=data.find(row=>row.video_id===videoId);
                        if(stored&&Number.isFinite(Number(stored.view_count))){
                          current.view_count=Math.max(0,Number(stored.view_count));
                          const index=state.videos.indexOf(current);
                          const counter=document.getElementById("viewcount-"+index);
                          if(counter)counter.textContent=String(current.view_count);
                        }
                      }
                    }catch(error){console.warn("Could not refresh reel count",error);}
                  }
                }catch(error){
                  state.viewRetryAfter.set(videoId,Date.now()+60000);
                  console.warn("View tracking unavailable; retry after cooldown",error);
                }finally{
                  if(!credited)state.viewAttempts.delete(videoId);
                }
              },2000);
            });
            video.addEventListener("pause",()=>clearTimeout(watchTimer));
            video.addEventListener("ended",()=>clearTimeout(watchTimer));
          }
        });

        // Mark liked state for signed-in user
        if (state.user) {
          scroller.querySelectorAll('[data-action="like"]').forEach(async (btn) => {
            const videoId = btn.dataset.id;
            const liked = await isVideoLiked(videoId, state.user.id);
            if (liked) btn.classList.add("active");
          });
        }
      }

      async function maybeLoadMore(idx) {
        if (state.loadingMore || state.exhausted) return;
        if (idx >= state.videos.length - 2) {
          state.loadingMore = true;
          const version=state.generation, next=state.offset+state.limit;
          try {
            const more=await fetchModePage(next);
            if (version!==state.generation) return;
            if (!more.length) state.exhausted=true;
            else {
              state.offset=next;
              const existing=new Set(state.videos.map(v=>v.id));
              const unique=more.filter(v=>!existing.has(v.id));
              const startLen=state.videos.length;
              state.videos.push(...unique);
              const scroller=document.getElementById("scroller");
              await attachUploaderBadgesAndCounts(unique);
              unique.forEach((v,i)=>scroller?.insertAdjacentHTML("beforeend",itemTemplate(v,startLen+i)));
              wireItems();
            }
          } catch(error) {
            console.warn("Could not load recommended videos:",error);
            root.setAttribute("data-load-error","true");
          } finally { if(version===state.generation) state.loadingMore=false; }
        }
      }

      // Comments drawer
      const drawer = document.getElementById("commentDrawer");
      const backdrop = document.getElementById("drawerBackdrop");
      const drawerList = document.getElementById("commentDrawerList");
      const drawerForm = document.getElementById("commentDrawerForm");
      const drawerInput = document.getElementById("commentDrawerInput");
      setupMentionInput(drawerInput);
      document.getElementById('videoCreatePoll').addEventListener('click',()=>{
        const video=state.videos.find(v=>v.id===state.commentsOpenFor);
        if(video&&state.user?.id===video.user_id)void openPollComposer('video',video.id,
          ()=>mountPoll(document.getElementById('videoCommentPoll'),'video',video.id));
      });
      for(const [control,column] of [['videoCommentsEnabled','allow_comments'],['videoDownloadsEnabled','allow_download']]){
        document.getElementById(control).addEventListener('change',async event=>{
          const video=state.videos.find(v=>v.id===state.commentsOpenFor);
          if(!video||video.user_id!==state.user?.id)return;
          const checkbox=event.target;checkbox.disabled=true;
          const {data,error}=await supabase.from('videos').update({[column]:checkbox.checked})
            .eq('id',video.id).eq('user_id',state.user.id)
            .select('id,allow_comments,allow_download').maybeSingle();
          if(error||!data||data.id!==video.id||data[column]!==checkbox.checked){
            checkbox.checked=!checkbox.checked;
            window.appUI?.toast?.(error?.message||"The database did not confirm this change. Please try again.");
          }
          else{
            video[column]=checkbox.checked;
            if(column==='allow_comments'){
              drawerForm.hidden=!checkbox.checked;
              document.getElementById('videoCommentsDisabledNotice').hidden=checkbox.checked;
            }else{
              const target=document.querySelector(`[data-action="download"][data-id="${video.id}"]`);
              if(target)target.hidden=!checkbox.checked;
            }
          }
          checkbox.disabled=false;
        });
      }
      let replyingTo = null;
      const commentProfiles=new Map();
      const commentIdentityCache=new Map();

      function renderCommentTree(comments, parentId = null, depth = 0) {
        const loadedIds = new Set(comments.map(c => c.id));
        // Pages may contain replies whose parent belongs to an older page.
        // Render those replies as independent roots until the parent arrives.
        const children = comments.filter(c => (c.reply_to || null) === parentId ||
          (parentId === null && c.reply_to && !loadedIds.has(c.reply_to)));
        if (!children.length) return "";
        return children
          .map((c) => {
            const nested = renderCommentTree(comments, c.id, depth + 1);
            return `
              <div class="comment-row ${verifiedCommentClass(commentProfiles.get(c.user_id))}" style="margin-left:${Math.min(depth, 4) * 16}px;" data-comment-id="${c.id}">
                <a class="reel-comment-author" href="profile.html?id=${encodeURIComponent(c.user_id||'')}">${verifiedAvatar(commentProfiles.get(c.user_id)?.avatar_url,commentProfiles.get(c.user_id),{size:"sm",alt:""})}${verifiedName(publicIdentityName(commentProfiles.get(c.user_id),c.author_name),commentProfiles.get(c.user_id),{compact:true})}</a>
                <p>${renderSocialText(c.body || "")}</p>
                <div class="reel-comment-actions">
                  <button class="comment-reply-btn" data-reply-id="${c.id}" data-reply-name="${escapeHTML(publicIdentityName(commentProfiles.get(c.user_id),c.author_name))}">Reply</button>
                  <button class="comment-like-btn" data-comment-like="${c.id}" aria-pressed="${c.viewer_liked===true}" aria-label="Like comment" type="button">${c.viewer_liked?"♥ Liked":"♡ Like"} <span>${Number(c.like_count||0)}</span></button>
                </div>
                ${nested}
              </div>
            `;
          })
          .join("");
      }

      function updateReplyIndicator() {
        let bar = document.getElementById("commentReplyBar");
        if (!replyingTo) {
          if (bar) bar.remove();
          drawerInput.placeholder = "Add a comment...";
          return;
        }
        if (!bar) {
          bar = document.createElement("div");
          bar.id = "commentReplyBar";
          bar.className = "comment-reply-indicator";
          drawerForm.parentNode.insertBefore(bar, drawerForm);
        }
        bar.innerHTML = `<span class="comment-reply-target">Replying to <strong>${escapeHTML(replyingTo.name)}</strong></span><button type="button" id="cancelCommentReply" aria-label="Cancel reply" title="Cancel reply">&times;</button>`;
        drawerInput.placeholder = `Reply to ${replyingTo.name}...`;
        document.getElementById("cancelCommentReply").addEventListener("click", () => {
          replyingTo = null;
          updateReplyIndicator();
        });
      }

      const commentLoadMoreBtn = document.getElementById("commentLoadMoreBtn");
      const COMMENT_PAGE_SIZE = 40;
      let commentRows = [];
      let commentOffset = 0;
      let commentGeneration = 0;
      let commentLoading = false;

      function renderLoadedComments() {
        drawerList.innerHTML = commentRows.length
          ? renderCommentTree(commentRows)
          : '<div class="comment-empty">No comments yet — say something first.</div>';
        drawerList.querySelectorAll(".comment-reply-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            replyingTo = { id: btn.dataset.replyId, name: btn.dataset.replyName };
            updateReplyIndicator();
            drawerInput.focus();
          });
        });
        drawerList.querySelectorAll("[data-comment-like]").forEach(btn=>{
          btn.addEventListener("click",async()=>{
            if(!state.user){location.href="login.html?next="+encodeURIComponent(location.href);return;}
            const id=btn.dataset.commentLike;
            const row=commentRows.find(c=>c.id===id);
            if(!row||btn.disabled)return;
            btn.disabled=true;
            const was=!!row.viewer_liked;
            try{
              const action=was
                ?supabase.from("video_comment_likes").delete().eq("comment_id",id).eq("user_id",state.user.id)
                :supabase.from("video_comment_likes").insert({comment_id:id,user_id:state.user.id});
              const {error}=await action;
              if(error)throw error;
              row.viewer_liked=!was;
              row.like_count=Math.max(0,Number(row.like_count||0)+(was?-1:1));
              btn.setAttribute("aria-pressed",String(row.viewer_liked));
              btn.innerHTML=(row.viewer_liked?"♥ Liked":"♡ Like")+" <span>"+row.like_count+"</span>";
            }catch(error){console.warn("Comment like failed",error);}
            finally{btn.disabled=false;}
          });
        });
      }

      async function loadCommentPage(videoId, generation) {
        if (commentLoading || state.commentsOpenFor !== videoId) return;
        commentLoading = true;
        commentLoadMoreBtn.disabled = true;
        commentLoadMoreBtn.textContent = "Loading comments…";
        try {
          const page = await fetchVideoCommentPage(videoId, {
            offset: commentOffset,
            limit: COMMENT_PAGE_SIZE
          });
          if (generation !== commentGeneration || state.commentsOpenFor !== videoId) return;
          // A single bounded lookup decorates the whole comment page.
          try{
            const identities=await loadVerifiedIdentityMap(supabase,page.map(row=>row.user_id).filter(Boolean),commentIdentityCache);
            if(generation!==commentGeneration||state.commentsOpenFor!==videoId)return;
            for(const [id,profile] of identities)commentProfiles.set(id,profile);
          }catch(error){console.warn("Video comment verification unavailable",error.message);}
          if(generation!==commentGeneration||state.commentsOpenFor!==videoId)return;
          const counts=page.length?await supabase.rpc("video_comment_like_counts",{
            p_comment_ids:page.map(c=>c.id)
          }):{data:[],error:null};
          if(generation!==commentGeneration||state.commentsOpenFor!==videoId)return;
          const byId=new Map((counts.data||[]).map(c=>[c.comment_id,c]));
          commentRows=[...commentRows,...page.map(c=>({
            ...c,like_count:Number(byId.get(c.id)?.like_count||0),
            viewer_liked:byId.get(c.id)?.viewer_liked===true
          }))];
          commentOffset += page.length;
          renderLoadedComments();
          commentLoadMoreBtn.hidden = page.length < COMMENT_PAGE_SIZE;
        } catch (error) {
          if (generation !== commentGeneration || state.commentsOpenFor !== videoId) return;
          if (!commentRows.length) drawerList.textContent = "Comments could not be loaded. Try again.";
          console.warn("Video comments failed to load:", error);
          commentLoadMoreBtn.hidden = false;
        } finally {
          if (generation === commentGeneration) {
            commentLoading = false;
            commentLoadMoreBtn.disabled = false;
            commentLoadMoreBtn.textContent = commentRows.length ? "Load more comments" : "Retry loading comments";
          }
        }
      }

      let resumeAfterComments = false;
      async function openComments(videoId) {
        // Refreshing the list after posting must not erase the playback state
        // captured when comments first opened.
        if (state.commentsOpenFor !== videoId) {
          const activeReel = document.getElementById("video-" + state.activeIndex);
          resumeAfterComments = Boolean(activeReel && !activeReel.paused);
          document.querySelectorAll(".reel-video").forEach(video => video.pause());
        }
        state.commentsOpenFor = videoId;
        const video=state.videos.find(v=>v.id===videoId);
        const isOwner=Boolean(state.user&&video?.user_id===state.user.id);
        const controls=document.getElementById('videoCommentCreatorControls');
        controls.hidden=!isOwner;
        document.getElementById("videoCommentsEnabled").checked=video?.allow_comments!==false;
        document.getElementById("videoDownloadsEnabled").checked=video?.allow_download!==false;
        const allowed=video?.allow_comments!==false;
        drawerForm.hidden=!allowed;
        document.getElementById("videoCommentsDisabledNotice").hidden=allowed;
        const pollHost=document.getElementById("videoCommentPoll");
        pollHost.replaceChildren();
        if(state.user)void mountPoll(pollHost,'video',videoId);
        commentGeneration++;
        const generation = commentGeneration;
        commentRows = [];
        commentProfiles.clear();
        commentIdentityCache.clear();
        commentOffset = 0;
        commentLoading = false;
        replyingTo = null;
        updateReplyIndicator();
        drawer.classList.add("open");
        backdrop.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
        drawerList.innerHTML = '<div class="comment-empty">Loading…</div>';
        commentLoadMoreBtn.hidden = true;
        await loadCommentPage(videoId, generation);
      }

      function closeComments() {
        commentGeneration++;
        drawer.classList.remove("open");
        backdrop.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
        state.commentsOpenFor = null;
        replyingTo = null;
        updateReplyIndicator();
        if (document.activeElement === drawerInput) drawerInput.blur();
        if (resumeAfterComments) {
          const active = document.getElementById("video-" + state.activeIndex);
          if (active) playWithSoundFallback(active, state.activeIndex, {explicit:true});
        }
        resumeAfterComments = false;
        scheduleReelViewportSync();
        commentLoading = false;
        commentLoadMoreBtn.hidden = true;
      }

      commentLoadMoreBtn.addEventListener("click", () => {
        if (state.commentsOpenFor) void loadCommentPage(state.commentsOpenFor, commentGeneration);
      });

      document.getElementById("commentDrawerClose").addEventListener("click", closeComments);
      backdrop.addEventListener("click", closeComments);

      drawerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const selected=state.videos.find(v=>v.id===state.commentsOpenFor);
        if(selected?.allow_comments===false){window.appUI?.toast?.("The creator disabled comments on this video.");return;}
        const body = drawerInput.value.trim();
        if (!body || !state.commentsOpenFor) return;
        if (!state.user) {
          window.location.href = `login.html?next=${encodeURIComponent(window.location.href)}`;
          return;
        }
        const own=await supabase.from("public_profiles").select("username,display_name").eq("id",state.user.id).maybeSingle();
        const authorName=publicIdentityName(own.data,state.user.user_metadata?.display_name||"Member");
        const result = await commentOnVideo(state.commentsOpenFor, state.user.id, authorName, body, replyingTo?.id || null);
        if (!result.error) {
          drawerInput.value = "";
          const video = state.videos.find((v) => v.id === state.commentsOpenFor);
          if (video && video.user_id && video.user_id !== state.user.id) {
            notifyVideoComment(video.user_id, authorName, state.commentsOpenFor).catch((error) => console.warn("Video-comment notification failed:", error));
          }
          const currentVideoId=state.commentsOpenFor;
          const counters=await supabase.rpc("video_social_counts",{p_video_ids:[currentVideoId]});
          const total=Number(counters.data?.[0]?.comment_count||0);
          const badge=state.videos.findIndex(v=>v.id===currentVideoId);
          if(badge>=0){
            state.videos[badge].comment_count=total;
            const count=document.getElementById("commentcount-"+badge);
            if(count)count.textContent=String(total);
          }
          replyingTo=null;
          void openComments(currentVideoId);
        }
      });

      // Attach seller/uploader verification + staff-pick + comment counts in a batch (avoid N+1)
      async function attachUploaderBadgesAndCounts(videos) {
        if(!videos.length)return;
        const ids=videos.map(v=>v.id).filter(Boolean).slice(0,50);
        const userIds=[...new Set(videos.map(v=>v.user_id).filter(Boolean))];
        // Public reel metadata joins to public_profiles on the server and
        // never returns a legacy email or display name as the public handle.
        // Run alongside verified-profile and engagement lookups so a transient
        // failure in one feature does not hide the creator's identity.
        const [identity,profilesResult,countsResult]=await Promise.allSettled([
          supabase.rpc("reel_public_metadata",{p_video_ids:ids}),
          userIds.length?supabase.from("public_profiles")
            .select("id,username,display_name,avatar_url,is_verified,verification_tier,verification_expires_at,official_badge_kind,official_badge_title,frame_style,is_staff_pick")
            .in("id",userIds):Promise.resolve({data:[],error:null}),
          supabase.rpc("video_social_counts",{p_video_ids:ids})
        ]);
        const usable=result=>result.status==="fulfilled"&&!result.value?.error
          ?result.value.data||[]:[];
        const publicById=new Map(usable(identity).map(row=>[row.video_id,row]));
        let profiles=usable(profilesResult);
        if(!profiles.length&&userIds.length){
          // Retry the essential public username alone if an optional badge or
          // profile field prevented the larger select from succeeding.
          const fallback=await supabase.from("public_profiles")
            .select("id,username").in("id",userIds);
          if(!fallback.error)profiles=fallback.data||[];
          else console.warn("Reel public username lookup failed",fallback.error.code||"unknown");
        }
        const profileById=new Map(profiles.map(p=>[p.id,p]));
        const countsById=new Map(usable(countsResult).map(row=>[row.video_id,row]));
        videos.forEach(v=>{
          const publicRow=publicById.get(v.id);
          const p=profileById.get(v.user_id);
          const validated=publicIdentityName(
            publicRow?.username?{username:publicRow.username}:p
          );
          // Only a verified public username is displayed. Stored author_name
          // can contain obsolete real names/emails and is never used to override.
          v.uploader_profile=p||(
            validated!=="Member"?{username:validated}:null
          );
          if(v.uploader_profile&&validated!=="Member")
            v.uploader_profile.username=validated;
          if(v.uploader_profile&&v.user_id)v.uploader_profile.id=v.user_id;
          v.uploader_staff_pick=!!p?.is_staff_pick;
          if(publicRow?.view_count!==undefined)
            v.view_count=Math.max(0,Number(publicRow.view_count)||0);
          v.like_count=Number(countsById.get(v.id)?.like_count??v.like_count??0);
          v.comment_count=Number(countsById.get(v.id)?.comment_count??v.comment_count??0);
        });
      }

      async function bootFeed(includeStartingVideo = false) {
        const version=++state.generation;
        renderLoading();
        if (state.mode==="following" && !state.user) {
          root.innerHTML='<div class="reel-empty"><div>Sign in to see creators you follow. <a class="btn" href="login.html?next=video.html%3Fmode%3Dfollowing">Log in</a></div></div>';
          return;
        }
        try {
          let initial=[];
          if (includeStartingVideo && startId) {
            const requested=await fetchVideoById(startId);
            if (requested?.is_public) initial.push(requested);
          }
          const feed=await fetchModePage(0);
          if(version!==state.generation)return;
          feed.forEach(v=>{if(!initial.some(x=>x.id===v.id))initial.push(v);});
          state.offset=0;
          state.exhausted=feed.length<state.limit;
          if(!initial.length){renderEmpty();return;}
          await attachUploaderBadgesAndCounts(initial);
          if(version!==state.generation)return;
          state.videos=initial;
          render();
        } catch(error) {
          if(version!==state.generation)return;
          console.warn("Could not load video feed:",error);
          root.innerHTML='<div class="reel-empty"><div>Videos are temporarily unavailable. <button class="btn" type="button" id="retryReel">Retry</button></div></div>';
          document.getElementById("retryReel")?.addEventListener("click",()=>void bootFeed(false));
        }
      }
      async function boot() {
        state.user=await getCurrentUser();
        state.preferences=mergePreferences(await loadUserPreferences(state.user));
        try {
          const savedMute=sessionStorage.getItem("timzee:reels-muted");
          state.sessionMuted = savedMute === null ? state.preferences.videos.mutedByDefault === true : savedMute === "true";
        } catch { state.sessionMuted = state.preferences.videos.mutedByDefault === true; }
        syncHeaderMute();
        if(state.mode==="for-you" && state.preferences.feed.showRecommendations===false){
          state.mode="following"; updateReelModeButtons();
        }
        await bootFeed(true);
      }
      boot();
    </script>
    <script type="module" src="assets/js/blipmood-unified-menu.mjs"></script>
  </body>
