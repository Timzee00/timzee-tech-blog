<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Watch - Blipmood</title>
    <meta name="description" content="Watch creator videos from the Blipmood community">
    <meta name="theme-color" content="#05050a">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script defer src="assets/js/theme-init.js"></script>
    <style>
      :root {
        --reel-bg: #05050a;
        --reel-glass: rgba(12, 14, 20, 0.55);
        --reel-glass-strong: rgba(12, 14, 20, 0.78);
        --reel-line: rgba(255, 255, 255, 0.14);
        --reel-gradient: linear-gradient(135deg, #0f766e 0%, #0ea5e9 100%);
        --reel-warn: #f97316;
      }

      html, body {
        background: var(--reel-bg);
        overscroll-behavior-y: contain;
      }

      body.reel-mode {
        margin: 0;
        height: var(--reel-screen-height, 100dvh);
        overflow: hidden;
        font-family: var(--font-body, "Sora", sans-serif);
      }

      .reel-scroller {
        height: var(--reel-screen-height, 100dvh);
        overflow-y: scroll;
        overscroll-behavior-y: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
      }
      .reel-scroller::-webkit-scrollbar { display: none; }

      .reel-item {
        position: relative;
        height: var(--reel-screen-height, 100dvh);
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        background: #000;
      }

      .reel-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .reel-vignette {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%);
        pointer-events: none;
      }

      .reel-progress {
        position: absolute;
        top: auto; bottom: max(8px, env(safe-area-inset-bottom));
        left: 12px; right: 12px;
        height: 6px;
        border-radius:999px;
        touch-action:none;
        background: rgba(255,255,255,0.18);
        z-index: 22;
        cursor: pointer;
      }
      /* Invisible larger hit-area so the 3px bar is actually draggable on a
         touch screen (the visible bar stays thin, the tappable area doesn't). */
      .reel-progress::before {
        content: "";
        position: absolute;
        top: -18px;
        left: 0;
        right: 0;
        bottom: -18px;
      }
      .reel-progress.dragging {
        height: 10px;
      }
      .reel-progress-fill {
        height: 100%;
        width: 0%;
        background: var(--reel-gradient);
        transition: width 0.1s linear;
      }

      .reel-back {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: var(--reel-glass);
        backdrop-filter: blur(8px);
        border: 1px solid var(--reel-line);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        text-decoration: none;
        cursor: pointer;
      }
      .reel-mute {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        background: var(--reel-glass);
        backdrop-filter: blur(8px);
        border: 1px solid var(--reel-line);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
      }

      .reel-tapzone {
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .reel-pause-flash {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        width: 64px; height: 64px;
        border-radius: 999px;
        background: rgba(0,0,0,0.45);
        color: #fff;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .reel-pause-flash.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .reel-heart-burst {
        position: absolute;
        transform: translate(-50%, -50%) scale(0.4);
        font-size: 90px;
        color: #ff3b5c;
        text-shadow: 0 4px 18px rgba(0,0,0,0.35);
        z-index: 4;
        pointer-events: none;
        animation: reelHeartBurst 0.7s ease forwards;
      }

      @keyframes reelHeartBurst {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        40% { transform: translate(-50%, -50%) scale(0.95); }
        75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(-20px); }
      }

      .reel-buffer-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        animation: reelSpin 0.8s linear infinite;
        transition: opacity 0.15s ease;
      }
      .reel-buffer-spinner.show { opacity: 1; }

      @keyframes reelSpin {
        to { transform: rotate(360deg); }
      }

      .reel-scrub-time {
        position: absolute;
        top: auto;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        z-index: 22;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      .reel-scrub-time.show { opacity: 1; }

      .reel-bottom {
        position: relative;
        z-index: 5;
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 14px max(18px, env(safe-area-inset-bottom)) 14px;
        gap: 12px;
      }

      .reel-meta {
        flex: 1;
        min-width: 0;
        color: #fff;
      }
      .reel-uploader {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .reel-avatar {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--reel-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
        border: 2px solid rgba(255,255,255,0.5);
        color: #fff;
        text-decoration: none;
      }
      .reel-username {
        font-weight: 700;
        font-size: 14.5px;
      }
      .reel-verified {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: var(--reel-gradient);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        margin-left: 4px;
        vertical-align: middle;
      }
      .reel-staff {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(34, 197, 94, 0.9);
        color: #06280f;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        margin-left: 4px;
        vertical-align: middle;
      }
      .reel-caption {
        font-size: 14px;
        line-height: 1.4;
        margin: 0 0 6px 0;
        max-width: 78vw;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .reel-caption-more{background:transparent;color:#e3f4f0;border:0;text-decoration:underline;font:700 12px system-ui;padding:4px 0 8px;min-height:36px;cursor:pointer}
      .reel-caption.expanded {
        -webkit-line-clamp: unset;
        overflow:visible;
        max-height:42dvh;
        overflow-y:auto;
      }
      .reel-caption a,.reel-tag{color:#b5f4e9;text-decoration:underline;text-underline-offset:2px;position:relative;z-index:1}
      .reel-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .reel-tag {
        font-size: 12px;
        color: #bfe9ff;
        opacity: 0.9;
      }

      .reel-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
      }
      .reel-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: none;
        border: none;
        cursor: pointer;
        color: #fff;
        padding: 0;
      }
      .reel-chip-icon {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: var(--reel-glass);
        backdrop-filter: blur(8px);
        border: 1px solid var(--reel-line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      .reel-chip.active .reel-chip-icon {
        background: var(--reel-gradient);
        border-color: transparent;
        box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18);
      }
      .reel-chip:active .reel-chip-icon {
        transform: scale(0.88);
      }
      .reel-chip-count {
        font-size: 11.5px;
        font-weight: 600;
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      }

      .reel-empty, .reel-loading {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-align: center;
        padding: 24px;
        font-size: 15px;
        opacity: 0.8;
      }

      /* Comments drawer */
      .comment-drawer {
        position: fixed;
        inset: auto 0 0 0;
        height: 62vh;
        background: #14151b;
        border-radius: 20px 20px 0 0;
        z-index: 20;
        transform: translateY(100%);
        transition: transform 0.28s ease;
        display: flex;
        flex-direction: column;
        box-shadow: 0 -12px 40px rgba(0,0,0,0.4);
      }
      .comment-drawer.open {
        transform: translateY(0);
      }
      .comment-drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .comment-drawer-header h3 {
        margin: 0;
        color: #fff;
        font-size: 15px;
      }
      .comment-drawer-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        opacity: 0.7;
        line-height: 1;
      }
      .comment-load-more {
        display: block; width: calc(100% - 32px); min-height: 44px; margin: 8px 16px 14px;
        border: 1px solid var(--color-border-strong,rgba(255,255,255,.26));
        border-radius: 10px; color: #fff; background: rgba(255,255,255,.12);
        font: 650 14px var(--font-body); cursor: pointer;
      }
      .comment-load-more[hidden] { display: none; }
      .comment-load-more:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
      .comment-drawer-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 16px;
      }
      .comment-row {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        color: #e7e7ea;
      }
      .comment-row strong {
        color: #fff;
        font-size: 13px;
      }
      .comment-row p {
        margin: 3px 0 0 0;
        font-size: 13.5px;
        line-height: 1.4;
      }
      .comment-empty {
        color: rgba(255,255,255,0.5);
        text-align: center;
        padding: 30px 10px;
        font-size: 13.5px;
      }
      .comment-reply-btn {
        background: none;
        border: none;
        color: #7dd3fc;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 0;
        cursor: pointer;
      }
      /* The reply target is its own row ABOVE the composer, never a flex sibling of the input. */
      .comment-reply-indicator {
        display: flex;
        flex: 0 0 auto;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 16px;
        font-size: 13px;
        color: rgba(255,255,255,0.78);
        background: rgba(255,255,255,0.06);
      }
      .comment-reply-target {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .comment-reply-indicator button {
        flex: 0 0 auto;
        min-width: 36px;
        min-height: 36px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 50%;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
      }
      .comment-reply-indicator button:focus-visible {
        outline: 2px solid #7dd3fc;
        outline-offset: 2px;
      }
      .comment-drawer-form {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
        padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .comment-drawer-form input {
        box-sizing: border-box;
        flex: 1 1 0%;
        width: 100%;
        min-width: 0;
        min-height: 44px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 10px 14px;
        color: #fff;
        font-size: 16px;
      }
      .comment-drawer-form input::placeholder { color: rgba(255,255,255,0.4); }
      .comment-drawer-form > button[type="submit"] {
        flex: 0 0 auto;
        min-width: 72px;
        min-height: 44px;
        white-space: nowrap;
        background: var(--reel-gradient);
        border: none;
        color: #fff;
        border-radius: 999px;
        padding: 0 16px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 19;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }
      .drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      @media (min-width: 720px) {
        .reel-item { justify-content: center; }
        .reel-video { max-width: 480px; left: 50%; transform: translateX(-50%); width: 480px; border-radius: 0; }
        .reel-vignette, .reel-bottom { max-width: 480px; left: 50%; transform: translateX(-50%); }
        .reel-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
        .comment-drawer { max-width: 480px; left: 50%; transform: translate(-50%, 100%); }
        .comment-drawer.open { transform: translate(-50%, 0); }
      }
      .reel-edit-caption{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;padding:4px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.38);color:white;background:rgba(10,30,35,.78);font:750 12px system-ui;cursor:pointer}
      .reel-edit-caption:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}
      .reel-editor-dialog{border:1px solid #658e8b;border-radius:17px;width:min(92vw,460px);max-height:85dvh;overflow-y:auto;background:#10252b;color:white;padding:22px}
      .reel-editor-dialog::backdrop{background:rgba(1,6,10,.8)}
      .reel-editor-dialog form{display:grid;gap:13px}
      .reel-editor-dialog label{display:grid;gap:5px;font:650 14px system-ui}
      .reel-editor-dialog :is(input,textarea){box-sizing:border-box;min-height:43px;width:100%;padding:11px;border:1px solid #7f9f9e;border-radius:9px;background:#18353c;color:white;font:inherit}
      .reel-editor-dialog textarea{resize:vertical;min-height:95px}
      .reel-editor-dialog .edit-actions{display:flex;flex-wrap:wrap;gap:8px}
      .reel-editor-dialog .edit-actions button{min-height:44px;padding:8px 14px;border-radius:9px;border:1px solid #8eb7b1;background:#17685e;color:white;font:700 14px system-ui}
      .reel-editor-dialog #reelEditStatus{font-size:13px;min-height:20px}
      .reel-feed-modes { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:90; display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(10,13,18,.84); border:1px solid rgba(255,255,255,.19); backdrop-filter:blur(12px); }
      .reel-feed-modes button { border:0; background:transparent; color:#cbd5e1; border-radius:999px; padding:9px 15px; min-height:42px; font:700 13px system-ui; cursor:pointer; white-space:nowrap; }
      .reel-feed-modes button.active { color:#fff; background:#0f766e; }
      .reel-feed-modes button:focus-visible { outline:3px solid #7dd3fc; outline-offset:2px; }

      .reel-comment-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
      .comment-like-btn{border:0;background:transparent;color:#d2f7ed;font:650 12px system-ui;min-height:36px;padding:5px 0;cursor:pointer}
      .comment-like-btn[aria-pressed="true"]{color:#ff6a8d}
      .comment-like-btn:disabled{opacity:.55}
      .reel-tapzone{pointer-events:auto;touch-action:pan-y}
      .reel-back{min-width:44px;min-height:44px}

      /* A SINGLE fixed header above snapping reels: comment/keyboard changes cannot move it. */
      .reel-nav {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 0;
        right: 0;
        z-index: 90;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: clamp(4px, 1.6vw, 10px);
        padding: 0 clamp(8px, 2vw, 18px);
        pointer-events: none;
      }
      .reel-nav > *, .reel-nav button, .reel-nav a { pointer-events: auto; }
      .reel-nav-actions { display:flex; align-items:center; gap:6px; }
      .reel-nav .reel-feed-modes {
        position: static;
        inset: auto;
        left: auto;
        top: auto;
        transform: none;
        justify-self: center;
        width: max-content;
        max-width: 100%;
        min-width: 0;
        padding: 4px;
      }
      .reel-nav .reel-feed-modes button {
        min-width: 0;
        white-space: nowrap;
        padding: 9px clamp(8px, 2.3vw, 15px);
      }
      .reel-nav .reel-mute { width:40px; height:40px; flex: 0 0 auto; }
      .reel-nav-create {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid rgba(255,255,255,.44);
        border-radius: 50%;
        color: white;
        background: linear-gradient(140deg,#0b9489,#0ea5e9);
        box-shadow: 0 4px 18px rgba(14,165,233,.35), inset 0 1px rgba(255,255,255,.28);
        font: 700 25px/1 system-ui;
        cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease;
      }
      .reel-nav-create::after {
        content:"";
        position:absolute;
        inset:-4px;
        border:1px solid rgba(125,211,252,.24);
        border-radius:inherit;
        pointer-events:none;
      }
      .reel-nav-create:hover { box-shadow: 0 6px 22px rgba(14,165,233,.55); }
      .reel-nav-create:active { transform:scale(.94); }
      .reel-nav :is(button,a):focus-visible { outline:3px solid #7dd3fc; outline-offset:3px; }
      @media (max-width:390px) {
        .reel-nav { grid-template-columns: 40px minmax(0,1fr) auto; gap:4px; padding:0 7px; }
        .reel-nav .reel-back { width:40px; height:40px; }
        .reel-nav .reel-feed-modes button { font-size:12px; padding:9px 7px; }
        .reel-nav-create, .reel-nav .reel-mute { width:36px; height:36px; min-height:36px; }
        .reel-nav-actions { gap:4px; }
      }
      .reel-upload-dialog {
        position: fixed;
        width: min(94vw, 530px);
        max-width: 530px;
        max-height: min(88dvh, 850px);
        margin:auto;
        padding:0;
        border:1px solid rgba(125,211,252,.35);
        border-radius:22px;
        background:#111c27;
        color:#f8fafc;
        color-scheme:dark;
        box-shadow:0 24px 80px rgba(0,0,0,.7);
        overflow:auto;
        overscroll-behavior:contain;
      }
      .reel-upload-dialog::backdrop { background:rgba(0,0,0,.78); backdrop-filter:blur(5px); }
      .reel-upload-head {
        position:sticky; top:0; z-index:2;
        display:flex; justify-content:space-between; align-items:center; gap:12px;
        padding:16px 18px; background:#142632;
        border-bottom:1px solid rgba(255,255,255,.14);
      }
      .reel-upload-head h2 { margin:0; font:750 19px/1.25 system-ui; }
      .reel-upload-close {
        flex:0 0 auto; width:40px; height:40px;
        border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08);
        color:#fff; border-radius:50%; font-size:23px; cursor:pointer;
      }
      .reel-upload-form,.reel-upload-signin { display:grid; gap:13px; padding:18px; }
      .reel-upload-form[hidden],.reel-upload-signin[hidden] { display:none; }
      .reel-upload-form label { display:grid; gap:5px; font:600 13px/1.4 system-ui; }
      .reel-upload-form :is(input:not([type="checkbox"]),textarea,select) {
        box-sizing:border-box; width:100%; min-width:0; min-height:43px; padding:11px;
        border:1px solid rgba(255,255,255,.25); background:#203241; color:#fff;
        border-radius:11px; font:400 16px/1.3 system-ui;
      }

    <style>
